<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecran Dynamique - Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            position: relative;
        }

        /* LIEN DIRECT ET FORCE POUR VOTRE IMAGE */
        .fond-global {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://github.io');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* LES MASQUES NOIRS INVISIBLES DE CHATGPT */
        .mask-noir-date { background: #000; position: absolute; z-index: 1; color: transparent; }
        
        .widget-transparent {
            background: transparent;
            border: none;
        }

        header { display: flex; justify-content: space-between; align-items: center; height: 14vh; position: relative; z-index: 10; }
        
        /* PLACEMENT ABSOLU PAR-DESSUS VOS CADRES ORIGINAUX */
        .flip-tuile-js { font-size: 2.4rem; font-weight: bold; color: #fff; text-transform: uppercase; background: #000; padding: 5px 10px; border-radius: 4px; }
        .heure-digitale-js { font-size: 2.2rem; font-weight: bold; color: #fff; background: #000; padding: 5px; border-radius: 4px; }

        main { display: flex; justify-content: space-between; height: 64vh; margin: 10px 0; position: relative; z-index: 10; }
        .colonne-gauche { width: 26%; background: transparent; }
        .colonne-droite { width: 22%; background: transparent; display: flex; flex-direction: column; gap: 10px; }
        .espace-central-libre { width: 50%; pointer-events: none; }

        .text-dynamique-transparent { color: #fff; font-weight: bold; background: #000; padding: 2px 5px; border-radius: 3px; display: inline-block; }

        footer { height: 18vh; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 10; }
        .ligne-des-7-jours { display: flex; justify-content: space-between; gap: 8px; }
        .carte-jour-js { background: #000; padding: 5px; text-align: center; border-radius: 5px; flex: 1; }

        .particule-feuille { position: absolute; width: 14px; height: 9px; background: #628c34; border-radius: 0 75% 0 75%; opacity: 0.65; animation: animationVent linear infinite; }
        @keyframes animationVent {
            0% { transform: translate(-40px, 0px) rotate(0deg); }
            100% { transform: translate(55vw, 180px) rotate(540deg); }
        }
    </style>
</head>
<body>

    <!-- FOND UNIQUE REVEILLE -->
    <div id="fond-ecran-principal" class="fond-global"></div>

    <div id="zone-feuilles-dynamiques" style="position: fixed; top: 20vh; left: 28vw; width: 46vw; height: 55vh; pointer-events: none; z-index: 2; overflow: hidden;"></div>

    <!-- POSITIONNEMENT DES TEXTES TRANSPARENTS PAR-DESSUS LES CADRES -->
    <header>
        <div style="width: 135px; height: 135px; background: transparent;"></div>
        <div style="display: flex; gap: 45px; position: absolute; left: 24.5%; top: 25px;">
            <div class="flip-tuile-js" id="date-jour">SAMEDI</div>
            <div class="flip-tuile-js" id="date-num">29</div>
            <div class="flip-tuile-js" id="date-mois">AOÛT</div>
            <div class="flip-tuile-js" id="date-annee">2026</div>
        </div>
        <div style="position: absolute; right: 25px; top: 55px;">
            <div class="heure-digitale-js" id="horloge-texte">12:50:00</div>
        </div>
    </header>

    <main>
        <div class="colonne-gauche">
            <div style="position: absolute; left: 20px; top: 120px; font-size: 3rem;" id="icone-meteo-courante">☁️</div>
            <div style="position: absolute; left: 20px; top: 180px; font-size: 3.5rem; font-weight: bold;" id="temp-meteo-courante">19°C</div>
        </div>

        <div class="espace-central-libre"></div>

        <div class="colonne-droite">
            <div style="position: absolute; right: 40px; top: 20px;"><span class="text-dynamique-transparent" id="val-saison">ÉTÉ 🌱</span></div>
            <div style="position: absolute; right: 40px; top: 110px;"><span class="text-dynamique-transparent" id="val-lever">06:49</span></div>
            <div style="position: absolute; right: 40px; top: 140px;"><span class="text-dynamique-transparent" id="val-coucher">20:30</span></div>
            <div style="position: absolute; right: 40px; top: 240px;"><span class="text-dynamique-transparent" id="val-lune">Pleine lune (100%)</span></div>
        </div>
    </main>

    <footer>
        <div class="bandeau-citation" style="text-align: center; font-size: 1.15rem; font-style: italic; width: 100%; margin-top: 50px;">
            Un environnement <span style="color: #8ad400; font-weight: bold;">stimulant</span> pour un avenir <span style="color: #8ad400; font-weight: bold;">prometteur</span>
        </div>
    </footer>

    <script>
        function actualiserEcran() {
            var tempsReel = new Date();
            var h = tempsReel.getHours().toString().padStart(2, '0');
            var m = tempsReel.getMinutes().toString().padStart(2, '0');
            var s = tempsReel.getSeconds().toString().padStart(2, '0');
            document.getElementById('horloge-texte').textContent = h + ':' + m + ':' + s;
            
            var listeJours = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'];
            var listeMois = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCÉMBRE'];
            
            document.getElementById('date-jour').textContent = listeJours[tempsReel.getDay()];
            document.getElementById('date-num').textContent = tempsReel.getDate();
            document.getElementById('date-mois').textContent = listeMois[tempsReel.getMonth()];
            document.getElementById('date-annee').textContent = tempsReel.getFullYear();
        }
        
        setInterval(actualiserEcran, 1000);
        actualiserEcran();

        var conteneurFeuilles = document.getElementById('zone-feuilles-dynamiques');
        function lancerFeuille() {
            var feuille = document.createElement('div');
            feuille.classList.add('particule-feuille');
            feuille.style.top = (Math.random() * 90) + '%';
            feuille.style.left = '-20px';
            feuille.style.animationDuration = (Math.random() * 2.5 + 3.5) + 's';
            conteneurFeuilles.appendChild(feuille);
            setTimeout(function() { feuille.remove(); }, 6000);
        }
        setInterval(lancerFeuille, 1800);
    </script>
</body>
</html>
