<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ecran Master Connected - Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        #school-view-bg, .decor-permanent { position: fixed; inset: 0 !important; width: 100vw !important; height: 100vh !important; background: url('fond-final.png') no-repeat center center / 100% 100% !important; z-index: 0 !important; filter: none !important; }
        #school-view-bg::after, .decor-permanent::after { content: ''; position: absolute; inset: 0; background: transparent; pointer-events: none; }
        #sky-gradient { position: fixed; inset: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 1 !important; mix-blend-mode: overlay !important; opacity: 0.45 !important; -webkit-mask-image: url("assets/sky-mask-v21.png") !important; mask-image: url("assets/sky-mask-v21.png") !important; -webkit-mask-size: 100% 100% !important; mask-size: 100% 100% !important; pointer-events: none; }
        .lune-dans-le-ciel { position: fixed; top: 11vh; right: 20vw; width: 4.5vw; height: 4.4vw; border-radius: 50%; background-image: radial-gradient(circle at 35% 35%,#fff 0 12%,#d8dbe0 42%,#8f9399 100%) !important; background-size: cover; background-position: center; border: 1.5px solid rgba(255,255,255,0.4) !important; box-shadow: 0 0 15px rgba(255,255,255,0.35); filter: grayscale(1) brightness(1.2); z-index: 35 !important; display: none; overflow: hidden; transition: opacity 8s ease-in-out; }
        #cloud-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 15 !important; opacity: 0; pointer-events: none; transition: opacity 4s ease-in-out; overflow:hidden; }
        #cloud-layer::before,#cloud-layer::after{content:'';position:absolute;top:4vh;left:-30vw;width:160vw;height:28vh;background:radial-gradient(ellipse at 15% 55%,rgba(255,255,255,.48) 0 8%,transparent 20%),radial-gradient(ellipse at 35% 45%,rgba(255,255,255,.36) 0 10%,transparent 24%),radial-gradient(ellipse at 58% 55%,rgba(255,255,255,.42) 0 9%,transparent 22%),radial-gradient(ellipse at 80% 45%,rgba(255,255,255,.30) 0 8%,transparent 20%);filter:blur(12px);animation:cloudMove 70s linear infinite;}
        #back-precipitations { position: fixed; inset:0; width:100vw; height:100vh; z-index: 25 !important; pointer-events:none; }
        #front-particles { position: fixed; inset:0; width:100vw; height:100vh; z-index: 30 !important; pointer-events:none; overflow:hidden; }
        .pos { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; }
        .boite-flip-haut, .boite-digitale-bas {
            background: #000000 !important;
            border: 1.5px solid rgba(43,177,245,.92) !important;
            border-radius: 9px !important;
            box-shadow: 0 7px 18px rgba(0,0,0,.72), inset 0 0 11px rgba(0,0,0,.9), 0 0 7px rgba(22,164,230,.22) !important;
        }
        .boite-flip-haut .flip-tuile-js, .heure-digitale-js {
            font-family: 'Arial Black', sans-serif !important;
            font-size: 2.10vw !important; font-weight: 900 !important; color: #ffffff !important; opacity: 1 !important;
            height: 6.2vh !important; line-height: 6.2vh !important; display: flex !important; align-items: center !important; justify-content: center !important; text-transform: uppercase !important;
        }
        .heure-digitale-js { font-size: 2.38vw !important; }
        .boite-flip-haut#date-panel-jour { left: 18.2vw !important; width: 15.5vw !important; height: 6.2vh !important; }
        .boite-flip-haut#date-panel-num { left: 34.2vw !important; width: 6.5vw !important; height: 6.2vh !important; }
        .boite-flip-haut#date-panel-mois { left: 41.2vw !important; width: 22.0vw !important; height: 6.2vh !important; }
        .boite-flip-haut#date-panel-annee { left: 63.7vw !important; width: 8.5vw !important; height: 6.2vh !important; }
        .boite-digitale-bas { position: absolute !important; right: 1.65vw !important; top: 3.1vh !important; width: 11.8vw !important; height: 6.2vh !important; z-index: 99 !important; }
        
        .montre-retro-cercle { position: absolute; right: 2.2vw; top: 15vh; width: 15.6vw; height: 15.6vw; background: #000000 !important; border: 2px solid #1d2633 !important; border-radius: 50%; box-shadow: 0px 4px 12px rgba(0,0,0,0.5); z-index: 99 !important; }
        .graduation { position: absolute; width: 2px; height: 8px; background: rgba(255,255,255,0.4); left: 50%; top: 2px; margin-left: -1px; transform-origin: 50% 7.6vw; z-index: 11; }
        .graduation.principale { width: 3px; height: 12px; background: #ffffff !important; top: 2px; }
        .chiffre-container-js { position: absolute; width: 2vw; height: 2vw; left: 50%; top: 12px; margin-left: -1vw; transform-origin: 50% 6.6vw; display: flex; align-items: center; justify-content: center; z-index: 12; }
        .chiffre-cadran-fixe { font-size: 0.95vw; font-weight: bold; color: #ffffff !important; }
        .aiguille { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 4px; z-index: 13; }
        .heure { width: 5px; height: 3.2vw; background-color: #fff; } .minute { width: 4px; height: 4.9vw; background-color: #8ad400; }
        .seconde { width: 1.5px; height: 5.15vw; background-color: #ff3b30; }
        .pivot { position: absolute; width: 12px; height: 12px; background: #a2f200; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 15; }
        .cadran-relief-bleu { position: absolute; left: 2vw !important; top: 15vh !important; width: 28.5vw !important; height: 38vh !important; background: #0d131a !important; border: 2px solid #212c3a !important; border-radius: 12px !important; box-shadow: 0 8px 16px rgba(0,0,0,0.7), inset 0 0 12px rgba(0,0,0,0.8) !important; z-index: 99 !important; }
        .cadran-relief-noir-bloc { background: #05080c !important; border: 2px solid #162029 !important; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.6); z-index: 99 !important; overflow: hidden; }
        .carte-prev-unique { width: 10.4vw; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 1.5vh 0; background: #0d131a !important; border: 2px solid #212c3a !important; border-radius: 12px !important; }
        .soleil-realiste-css { width: 3.2vw; height: 3.2vw; background: radial-gradient(circle, #fff 15%, #ffea00 55%, #ff7700 100%); border-radius: 50%; box-shadow: 0 0 18px rgba(255,210,0,0.75), 0 0 35px rgba(255,100,0,0.4); }
        .lune-doree-image { position: relative; width: 4.4vw; height: 4.4vw; border-radius: 50%; background-image: url('https://wikimedia.org') !important; background-size: cover; background-position: center; border: 1.5px solid rgba(255,255,255,0.4) !important; box-shadow: 0 0 14px rgba(255,255,255,0.35); filter: grayscale(1) brightness(1.2); display: block; overflow: hidden; }
        .cache-ombre-lunaire { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #05080c; border-radius: 50%; opacity: 0.85; }
        .case-illustration-pommier { width: 4.8vw; height: 4.8vw; position: relative; display: flex; align-items: center; justify-content: center; background: #121b24 !important; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
        .pommier-trunk { position: absolute; width: 4px; background: #5c4033; bottom: 0.2vw; height: 1.8vw; left: 50%; transform: translateX(-50%); }
        .pommier-canopy { position: absolute; border-radius: 50%; background: #2e7d32; width: 2.8vw; height: 2.8vw; bottom: 1.6vw; left: 50%; transform: translateX(-50%); }
        .pommier-fruit { position: absolute; width: 5px; height: 5px; background: #d32f2f; border-radius: 50%; }
        .picto-pro-meteo { position: relative; width: 4.8vw; height: 4.8vw; display: flex; align-items: center; justify-content: center; }
        .picto-pro-meteo .soleil-centre { width: 2.2vw; height: 2.2vw; background: #ffea00; border-radius: 50%; }
        .picto-pro-meteo .nuage-face { position: absolute; width: 3.2vw; height: 1.6vw; background: #ffffff; border-radius: 20px; bottom: 0.8vw; left: 0.8vw; }
        #zone-7-jours { position: absolute; left: 2vw !important; bottom: 4vh !important; width: 75vw !important; height: 24vh !important; display: flex !important; justify-content: space-between !important; z-index: 99999 !important; }
        #slogan-ecran-principal { position: absolute; left: 17.5vw; top: 14vh; width: 60vw; font-size: 1.6vw; color: #8ad400; font-weight: bold; text-transform: uppercase; z-index: 101 !important; }
    </style>
</head>
<body>
    <div id="sky-gradient"></div>
    <div class="lune-dans-le-ciel" id="lune-vrai-ciel"><div class="cache-lune-ciel"></div></div>
    <div id="school-view-bg" class="decor-permanent"></div>
    <div id="cloud-layer"></div> <div id="back-precipitations"></div> <div id="front-particles"></div>

    <div class="pos boite-flip-haut" id="date-panel-jour"><span id="date-jour">--</span></div>
    <div class="pos boite-flip-haut" id="date-panel-num"><span id="date-num">--</span></div>
    <div class="pos boite-flip-haut" id="date-panel-mois"><span id="date-mois">--</span></div>
    <div class="pos boite-flip-haut" id="date-panel-annee"><span id="date-annee">----</span></div>

    <div class="montre-retro-cercle" id="cadran-montre">
        <div class="pivot"></div> <div class="aiguille heure" id="needle-hour"></div> <div class="aiguille minute" id="needle-minute"></div> <div class="aiguille seconde" id="needle-second"></div>
    </div>
    <div class="boite-digitale-bas"><div class="heure-digitale-js" id="horloge-texte">--:--:--</div></div>
    
    <div class="cadran-relief-bleu" id="cadran-meteo-g" style="padding: 1.3vw; color: #ffffff;">
        <div style="font-size: 1.1vw; font-weight: bold; margin-bottom: 2px; text-align: left;">Marloie (Marche-en-Famenne)</div>
        <div style="font-size: 0.75vw; color: #aaaaaa; text-transform: uppercase; margin-bottom: 1.2vh; letter-spacing: 1px;">MÉTÉO ACTUELLE</div>
        <div style="display: flex; align-items: center; gap: 2vw; margin-bottom: 2.5vh;">
            <div class="picto-pro-meteo"><div class="soleil-centre"></div><div class="nuage-face"></div></div>
            <div style="text-align: left;">
                <div style="font-size: 4.2vw; font-weight: bold; line-height: 1;" id="courant-temp">--°C</div>
                <div style="font-size: 1.2vw; color: #ffffff; margin-top: 4px; font-weight: bold;" id="courant-desc">Calcul...</div>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 1.5vh; text-align: center; font-weight:bold;">
            <div style="flex: 1;"><div style="font-size: 0.65vw; color: #aaaaaa;">RESSENTIE</div><div style="font-size: 1.15vw; margin-top: 4px;" id="courant-ressenti">--°C</div></div>
            <div style="flex: 1; border-left: 1px solid rgba(255,255,255,0.1);"><div style="font-size: 0.65vw; color: #aaaaaa;">💧 HUMIDITÉ</div><div style="font-size: 1.15vw; margin-top: 4px;" id="courant-humidite">--%</div></div>
            <div style="flex: 1; border-left: 1px solid rgba(255,255,255,0.1);"><div style="font-size: 0.65vw; color: #aaaaaa;">💨 VENT</div><div style="font-size: 1.15vw; margin-top: 4px;" id="courant-vent">-- km/h</div></div>
            <div style="flex: 1; border-left: 1px solid rgba(255,255,255,0.1);"><div style="font-size: 0.65vw; color: #aaaaaa;">☀️ UV</div><div style="font-size: 1.1vw; margin-top: 4px;" id="courant-uv">--</div></div>
        </div>
    </div>

    <div class="cadran-relief-noir-bloc" id="cadran-saison-d" style="position: absolute; right: 20vw; top: 15vh; width: 17vw; height: 28vh; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="display: flex; justify-content: space-between; align-items: center; height: 46%; background: #121b24; padding: 0.5vw 1.2vw; position: relative;">
            <div style="text-align: left;">
                <div style="font-size: 1.1vw; color: #8ad400; font-weight: bold;">SAISON</div>
                <div style="font-size: 2vw; font-weight: bold; color: #ffffff;" id="sat-saison">ÉTÉ</div>
            </div>
            <div class="case-illustration-pommier">
                <div class="pommier-trunk"></div><div class="pommier-canopy"></div>
                <div class="pommier-fruit" style="bottom:2.4vw; left:3.3vw;"></div><div class="pommier-fruit" style="bottom:3vw; right:3.6vw;"></div>
            </div>
        </div>
        <div style="display: flex; flex-direction: column; justify-content: space-between; height: 52%; width: 100%; padding: 0.6vw 1.2vw 1vw 1.2vw;">
            <div style="font-size: 1.1vw; color: #8ad400; font-weight: bold; text-align: left;">SOLEIL</div>
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="soleil-realiste-css"></div>
                <div style="display: flex; gap: 1vw; text-align: left; align-items: center; font-family:'Arial'; font-weight:bold;">
                    <div><div style="font-size: 1.1vw; font-weight: bold; color: #fff;" id="sat-lever">06:48</div></div>
                    <div style="width: 1px; background: rgba(255,255,255,0.4); height: 2.5vh;"></div>
                    <div><div style="font-size: 1.1vw; font-weight: bold; color: #fff;" id="sat-coucher">20:32</div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="cadran-relief-noir-bloc" id="cadran-lune-d" style="position: absolute; right: 20vw; top: 45vh; width: 17vw; height: 17vh; padding: 1.1vw 1.2vw; display: flex; justify-content: space-between; align-items: center; font-family:'Arial'; font-weight:bold;">
        <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; text-align: left;">
            <div style="font-size: 1.1vw; color: #8ad400; font-weight: bold; font-family:'Arial Black';">LUNE</div>
            <div style="font-size: 0.78vw; line-height: 1.35; color: #ffffff;">
                <strong style="font-size: 0.95vw; color: #fff; display: block; margin-bottom: 2px;" id="lune-phase-nom">Calcul...</strong>
                Âge : <span id="lune-age">--</span> j<br>Éclairement : <span id="lune-ecl">--</span>%
            </div>
        </div>
        <div class="lune-doree-image"><div class="cache-ombre-lunaire" id="lune-ombre-widget"></div></div>
    </div>
    
    <div id="zone-7-jours"></div>
    <script>
        var vitesseVentActuelle = 11; var currentSaison = "ÉTÉ"; var weatherDescriptionGlobal = "Nuageux";
        var mC = document.getElementById('cadran-montre');
        for (var i = 1; i <= 12; i++) {
            var box = document.createElement('div'); box.className = 'chiffre-container-js'; box.style.transform = 'rotate(' + (i * 30) + 'deg)';
            var n = document.createElement('div'); n.className = 'chiffre-cadran-fixe'; n.textContent = i; n.style.transform = 'rotate(' + (-i * 30) + 'deg)';
            box.appendChild(n); mC.appendChild(box);
        }
        for (var j = 0; j < 60; j++) {
            var g = document.createElement('div'); g.className = (j % 5 === 0) ? 'graduation principale' : 'graduation'; g.style.transform = 'rotate(' + (j * 6) + 'deg)'; mC.appendChild(g);
        }
        function actualiserHorloge() {
            var tempsReel = new Date(); var h = tempsReel.getHours(); var m = tempsReel.getMinutes(); var s = tempsReel.getSeconds();
            document.getElementById('horloge-texte').textContent = h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
            document.getElementById('needle-hour').style.transform = 'translateX(-50%) rotate(' + ((h % 12) * 30 + m * 0.5) + 'deg)';
            document.getElementById('needle-minute').style.transform = 'translateX(-50%) rotate(' + (m * 6) + 'deg)';
            document.getElementById('needle-second').style.transform = 'translateX(-50%) rotate(' + (s * 6) + 'deg)';
            document.getElementById('date-jour').textContent = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'][tempsReel.getDay()];
            document.getElementById('date-num').textContent = String(tempsReel.getDate()).padStart(2, '0');
            document.getElementById('date-mois').textContent = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCEMBRE'][tempsReel.getMonth()];
            document.getElementById('date-annee').textContent = tempsReel.getFullYear();
            gererCycleJourNuit(h, m);
        }
        function executerMeteo() {
            let uM = 'https://open-meteo.com';
            fetch(uM).then(res => res.json()).then(data => {
                let cur = data.current;
                document.getElementById('courant-temp').textContent = Math.round(cur.temperature_2m) + "°C";
                document.getElementById('courant-ressenti').textContent = Math.round(cur.apparent_temperature) + "°C";
                document.getElementById('courant-humidite').textContent = cur.relative_humidity_2m + "%";
                vitesseVentActuelle = Math.round(cur.wind_speed_10m);
                document.getElementById('courant-vent').textContent = vitesseVentActuelle + " km/h";
                document.getElementById('courant-uv').textContent = Math.round(cur.uv_index || 0);
                document.getElementById('sat-lever').textContent = data.daily.sunrise[0].substring(11, 16);
                document.getElementById('sat-coucher').textContent = data.daily.sunset[0].substring(11, 16);
                let code = cur.weather_code;
                let desc = "Couvert"; if(code === 0) desc = "Ensoleillé"; if(code > 0 && code <= 3) desc = "Éclaircies"; if(code >= 51 && code <= 67) desc = "Pluie Fine"; if(code >= 80) desc = "Orageux";
                document.getElementById('courant-desc').textContent = desc; weatherDescriptionGlobal = desc;
                var bas = document.getElementById('zone-7-jours'); bas.innerHTML = "";
                const noms = ['DIM.', 'LUN.', 'MAR.', 'MER.', 'JEU.', 'VEN.', 'SAM.']; const mois = ['JANV.', 'FÉVR.', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUIL.', 'AOÛT', 'SEPT.', 'OCT.', 'NOV.', 'DÉC.'];
                var dRef = new Date();
                for(let index = 0; index < 7; index++) {
                    var dObj = new Date(); dObj.setDate(dRef.getDate() + index);
                    let card = document.createElement('div'); card.className = "carte-prev-unique";
                    card.innerHTML = `<div style="font-weight:bold;font-size:1.1vw;">${index===0?"AUJ.":noms[dObj.getDay()]}</div><div style="font-size:0.75vw;color:#aaa;">${dObj.getDate()} ${mois[dObj.getMonth()]}</div><div style="font-size:1.8vw;font-weight:bold;margin:1vh 0;">${Math.round(data.daily.temperature_2m_max[index])}°</div><div style="color:#25b8f4;font-size:1.2vw;">${Math.round(data.daily.temperature_2m_min[index])}°</div>`;
                    bas.appendChild(card);
                }
            }).catch(e => console.log(e));
        }
        function gererEffetsMeteoEtParticules(desc) {
            var nuage = document.getElementById('cloud-layer');
            if (desc.includes("Nuageux") || desc.includes("Couvert") || desc.includes("Éclaircies")) { nuage.style.opacity = "0.55"; } else { nuage.style.opacity = "0"; }
        }
        function gererCycleJourNuit(h, m) {
            var calque = document.getElementById('sky-gradient'); var moon = document.getElementById('lune-vrai-ciel');
            var totalMin = (h * 60) + m;
            if (totalMin >= 360 && totalMin < 1200) { calque.style.background = "transparent"; moon.style.display = "none"; } 
            else { calque.style.background = "rgba(0,0,0,0.4)"; moon.style.display = "block"; }
        }
        function calculPhaseLune() {
          var maintenant = new Date(); var nouvelleLuneRef = Date.UTC(2026, 7, 12, 17, 35, 0); var msEcoules = maintenant.getTime() - nouvelleLuneRef; var daysSinceNew = (msEcoules / (1000 * 60 * 60 * 24)) % 29.530588853; if (daysSinceNew < 0) daysSinceNew += 29.530588853;
          document.getElementById('lune-age').textContent = daysSinceNew.toFixed(1);
          let pct = Math.round((1 + Math.cos((daysSinceNew * Math.PI * 2) / 29.530588853)) * 50); document.getElementById('lune-ecl').textContent = pct;
          let sW = document.getElementById('lune-ombre-widget'); if (sW) { sW.style.left = daysSinceNew < 14.765 ? (pct + "%") : "0%"; sW.style.width = daysSinceNew < 14.765 ? (100 - pct + "%") : (pct + "%"); }
        }
        setInterval(actualiserHorloge, 1000); actualiserHorloge(); calculPhaseLune(); executerMeteo(); setInterval(executerMeteo, 900000);
    </script>
</body>
</html>
