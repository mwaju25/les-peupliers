    <script>
        var vitesseVentActuelle = 11; var currentSaison = "ÉTÉ"; var weatherDescriptionGlobal = "Nuageux";
        var mC = document.getElementById('cadran-montre');
        for (var i = 1; i <= 12; i++) {
            var box = document.createElement('div'); box.className = 'chiffre-container-js'; box.style.transform = 'rotate(' + (i * 30) + 'deg)';
            var n = document.createElement('div'); n.className = 'chiffre-cadran-fixe'; n.textContent = i; n.style.transform = 'rotate(' + (-i * 30) + 'deg)';
            box.appendChild(n); mC.appendChild(box);
        }
        for (var j = 0; j < 60; j++) {
            var g = document.createElement('div'); g.className = (j % 5 === 0) ? 'graduation principale' : 'graduation'; g.style.transform = 'rotate(' + (j * 6) + 'deg)'; mC.appendChild(g);
        }
        function actualiserHorloge() {
            var tempsReel = new Date(); var h = tempsReel.getHours(); var m = tempsReel.getMinutes(); var s = tempsReel.getSeconds();
            document.getElementById('horloge-texte').textContent = h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
            document.getElementById('needle-hour').style.transform = 'translateX(-50%) rotate(' + ((h % 12) * 30 + m * 0.5) + 'deg)';
            document.getElementById('needle-minute').style.transform = 'translateX(-50%) rotate(' + (m * 6) + 'deg)';
            document.getElementById('date-jour').textContent = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'][tempsReel.getDay()];
            document.getElementById('date-num').textContent = tempsReel.getDate();
            document.getElementById('date-mois').textContent = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCÉMBRE'][tempsReel.getMonth()];
            document.getElementById('date-annee').textContent = tempsReel.getFullYear();
            gererCycleJourNuit(h, m);
        }
        function executerMeteo() {
            let uM = 'https://open-meteo.com';
            fetch(uM).then(res => res.json()).then(data => {
                let cur = data.current;
                document.getElementById('courant-temp').textContent = Math.round(cur.temperature_2m) + "°C";
                document.getElementById('courant-ressenti').textContent = Math.round(cur.apparent_temperature) + "°C";
                document.getElementById('courant-humidite').textContent = cur.relative_humidity_2m + "%";
                vitesseVentActuelle = Math.round(cur.wind_speed_10m);
                document.getElementById('courant-vent').textContent = vitesseVentActuelle + " km/h";
                let uvVal = Math.round(cur.uv_index || 0);
                let uvText = "Bas"; if(uvVal >= 3 && uvVal <= 5) uvText = "Modéré"; if(uvVal >= 6) uvText = "Élevé";
                document.getElementById('courant-uv').textContent = uvVal + " / " + uvText;
                document.getElementById('sat-lever').textContent = data.daily.sunrise.substring(11, 16);
                document.getElementById('sat-coucher').textContent = data.daily.sunset.substring(11, 16);
                let code = cur.weather_code;
                let desc = "Éclaircies"; if(code === 0) desc = "Ensoleillé"; if(code > 0 && code <= 3) desc = "Éclaircies"; if(code >= 51 && code <= 67) desc = "Pluie Fine"; if(code >= 80) desc = "Orageux";
                document.getElementById('courant-desc').textContent = desc; weatherDescriptionGlobal = desc;
                gererEffetsMeteoEtParticules(desc.toLowerCase());
                var bas = document.getElementById('zone-7-jours'); bas.innerHTML = "";
                const noms = ['DIM.', 'LUN.', 'MAR.', 'MER.', 'JEU.', 'VEN.', 'SAM.'];
                const mois = ['JANV.', 'FÉVR.', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUIL.', 'AOÛT', 'SEPT.', 'OCT.', 'NOV.', 'DÉC.'];
                var dRef = new Date();
                for(let index = 0; index < 7; index++) {
                    var dObj = new Date(); dObj.setDate(dRef.getDate() + index);
                    injecterCartePrevisionHTML(bas, index, noms[dObj.getDay()], dObj.getDate(), mois[dObj.getMonth()], Math.round(data.daily.temperature_2m_max[index]), Math.round(data.daily.temperature_2m_min[index]), data.daily.weather_code[index]);
                }
        }).catch(() => {
                document.getElementById('courant-temp').textContent = "14°C"; document.getElementById('courant-ressenti').textContent = "13°C"; document.getElementById('courant-humidite').textContent = "85%"; document.getElementById('courant-vent').textContent = "5 km/h";
                document.getElementById('sat-lever').textContent = "06:48"; document.getElementById('sat-coucher').textContent = "20:26"; document.getElementById('courant-desc').textContent = "Éclaircies";
            });
        }
                    function injecterCartePrevisionHTML(conteneur, index, jourNom, jourNum, moisNom, maxT, minT, weatherCode) {
            let pType = "nuageux";
            if(weatherCode === 0) pType = "ensoleillé";
            else if(weatherCode > 0 && weatherCode <= 3) pType = "éclaircies";
            else if(weatherCode >= 51 && weatherCode <= 67) pType = "pluie";
            else if(weatherCode >= 80) pType = "orageux";
            
            let pictoHTML = "";
            if (pType === "ensoleillé") {
                pictoHTML = `<svg viewBox="0 0 24 24" style="width:2.5vw; height:2.5vw; display:block; margin:0 auto;"><circle cx="12" cy="12" r="5" fill="#ffa726"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#ffa726" stroke-width="2" stroke-linecap="round"/></svg>`;
            } else if (pType === "éclaircies") {
                pictoHTML = `<svg viewBox="0 0 24 24" style="width:2.5vw; height:2.5vw; display:block; margin:0 auto;"><circle cx="15" cy="9" r="3" fill="#ffb74d"/><path d="M6 19c0 .55.45 1 1 1h12c1.66 0 3-1.34 3-3 0-1.42-.97-2.6-2.3-2.92C19.34 11.51 17.11 9 14.5 9c-2.07 0-3.9 1.59-4.38 3.65C9.44 12.24 8.76 12 8 12c-2.21 0-4 1.79-4 4 0 .34.05.67.14 1c.23.82.95 1.47 1.86 1.84z" fill="#b0bec5"/></svg>`;
            } else if (pType === "pluie") {
                pictoHTML = `<svg viewBox="0 0 24 24" style="width:2.5vw; height:2.5vw; display:block; margin:0 auto;"><path d="M6 19c0 .55.45 1 1 1h12c1.66 0 3-1.34 3-3 0-1.42-.97-2.6-2.3-2.92C19.34 11.51 17.11 9 14.5 9c-2.07 0-3.9 1.59-4.38 3.65C9.44 12.24 8.76 12 8 12c-2.21 0-4 1.79-4 4 0 .34.05.67.14 1c.23.82.95 1.47 1.86 1.84z" fill="#78909c"/><path d="M10 21v2M14 21v2" stroke="#29b6f6" stroke-width="2" stroke-linecap="round"/></svg>`;
            } else {
                pictoHTML = `<svg viewBox="0 0 24 24" style="width:2.5vw; height:2.5vw; display:block; margin:0 auto;"><path d="M6 19c0 .55.45 1 1 1h12c1.66 0 3-1.34 3-3 0-1.42-.97-2.6-2.3-2.92C19.34 11.51 17.11 9 14.5 9c-2.07 0-3.9 1.59-4.38 3.65C9.44 12.24 8.76 12 8 12c-2.21 0-4 1.79-4 4 0 .34.05.67.14 1 .23.82.95 1.47 1.86 1.84c.14.06.31.11.48.14.17.03.34.02.52.02z" fill="#90a4ae"/></svg>`;
            }
            
            var box = document.createElement('div');
            box.className = "carte-prev-unique";
            box.innerHTML = `<div style="font-weight:bold; font-size:1.1vw; color:#fff; margin-bottom:2px; width:100%; text-align:center;">${index===0?"AUJ.":jourNom}</div><div style="font-size:0.75vw; color:#aaa; font-weight:bold; margin-bottom:4px; width:100%; text-align:center;">${jourNum} ${moisNom}</div><div style="width:3.2vw; height:3.2vw; display:flex; align-items:center; justify-content:center; overflow:visible; margin:0.3vh 0; position:relative;">${pictoHTML}</div><div style="font-size:2vw; font-weight:bold; color:#fff; margin-top:2px; width:100%; text-align:center;">${maxT}°</div><div style="color:#49a6e9; font-weight:bold; font-size:1.4vw; width:100%; text-align:center;">${minT}°</div>`;

        function gererEffetsMeteoEtParticules(desc) {
            var avant = document.getElementById('front-particles'); var nuage = document.getElementById('cloud-layer'); avant.innerHTML = "";
            if (desc.includes("nuageux") || desc.includes("éclaircies") || desc.includes("nuage") || desc.includes("averse")) { nuage.style.opacity = "0.55"; } else { nuage.style.opacity = "0"; }
            let masqueCiel = document.querySelector('.masque-ciel-strict');
            if (masqueCiel && nuage && !masqueCiel.contains(nuage)) { masqueCiel.appendChild(nuage); }
            if (nuage.style.opacity > 0) nuage.className = "anim-clouds";
            if (desc.includes("pluie") || desc.includes("averse")) {
                for (let i = 0; i < 35; i++) {
                    let g = document.createElement('div'); g.className = "goutte-particule"; g.style.left = (Math.random() * 100) + "vw"; g.style.setProperty('--wind-x', (Math.random() * 30 - 15) + "vw"); g.style.animationDuration = (Math.random() * 0.4 + 0.6) + "s"; g.style.animationDelay = (Math.random() * 2) + "s"; avant.appendChild(g);
                }
            }
        }
        function gererCycleJourNuit(h, m) {
            var calque = document.getElementById('sky-gradient'); var decor = document.getElementById('school-view-bg'); var moon = document.getElementById('lune-vrai-ciel'); var desc = weatherDescriptionGlobal.toLowerCase(); var totalMin = (h * 60) + m;
        var dateAujourdhui = new Date();
        var mo = dateAujourdhui.getMonth() + 1;
        var jour = dateAujourdhui.getDate();
        if (mo >= 3 && mo <= 5) currentSaison = "PRINTEMPS";
        else if (mo >= 6 && mo <= 8) currentSaison = "ÉTÉ";
        else if (mo === 9) { if (jour < 22) currentSaison = "ÉTÉ"; else currentSaison = "AUTOMNE"; }
        else if (mo >= 10 && mo <= 11) currentSaison = "AUTOMNE";
        else currentSaison = "HIVER";
            document.getElementById('sat-saison').textContent = currentSaison;
            let filtreSaisonCSS = ""; let tapisFeuilles = document.getElementById('tapis-feuilles-automne');
            if (currentSaison === "AUTOMNE") { decor.style.filter = "brightness(0.34) contrast(1.15) hue-rotate(35deg) saturate(1.2)"; if (tapisFeuilles) tapisFeuilles.style.opacity = "1"; }
            else if (currentSaison === "HIVER") { decor.style.filter = "brightness(1.45) contrast(0.85) grayscale(0.3)"; if (tapisFeuilles) tapisFeuilles.style.opacity = "0"; }
            else { if (tapisFeuilles) tapisFeuilles.style.opacity = "0"; }
            if (totalMin >= 360 && totalMin < 430) { calque.style.background = "linear-gradient(to bottom, #ff7e5f, #feb47b)"; decor.style.setProperty('filter', `brightness(0.75) contrast(1.05) ${filtreSaisonCSS}`, 'important'); moon.style.display = "none"; }
            else if (totalMin >= 430 && totalMin < 1160) { if (desc.includes("ensoleillé") || desc.includes("éclaircies")) { calque.style.background = "linear-gradient(to bottom, #2b5c8f, #4a90e2)"; } else { calque.style.background = "linear-gradient(to bottom, #4a5568, #718096)"; } decor.style.setProperty('filter', `brightness(1.15) saturate(1.1) ${filtreSaisonCSS}`, 'important'); moon.style.display = "none"; }
            else if (totalMin >= 1160 && totalMin < 1220) { calque.style.background = "linear-gradient(to bottom, #1a0b2e, #943126, #f39c12)"; decor.style.setProperty('filter', `brightness(0.9) saturate(1.1) ${filtreSaisonCSS}`, 'important'); moon.style.display = "block"; }
            else { if (desc.includes("nuageux") || desc.includes("averse")) { calque.style.background = "linear-gradient(to bottom, #050814, #121829)"; } else { calque.style.background = "linear-gradient(to bottom, #01030a, #030714)"; } decor.style.setProperty('filter', `brightness(0.34) contrast(1.15) ${filtreSaisonCSS}`, 'important'); moon.style.display = "block"; }
        }
        function calculPhaseLune() {
            var maintenant = new Date(); var nouvelleLuneRef = Date.UTC(2026, 7, 12, 17, 35, 0); var msEcoules = maintenant.getTime() - nouvelleLuneRef; var daysSinceNew = (msEcoules / (1000 * 60 * 60 * 24)) % 29.530588853; if (daysSinceNew < 0) daysSinceNew += 29.530588853;
            document.getElementById('lune-age').textContent = daysSinceNew.toFixed(1);
            let pct = Math.round((1 + Math.cos((daysSinceNew * Math.PI * 2) / 29.530588853)) * 50); document.getElementById('lune-ecl').textContent = pct;
            let pPhoto = document.getElementById('lune-vrai-photo'); if (pPhoto) { pPhoto.style.setProperty('background-image', "url('https://wikimedia.org')", 'important'); pPhoto.style.backgroundSize = 'cover'; pPhoto.style.backgroundPosition = 'center'; }
            let cCiel = document.getElementById('lune-vrai-ciel'); if (cCiel) { cCiel.style.backgroundImage = "url('https://wikimedia.org')"; cCiel.style.backgroundSize = 'cover'; cCiel.style.backgroundPosition = 'center'; }
            let sW = document.getElementById('lune-ombre-widget'); if (sW) { sW.style.setProperty('background', '#05080c', 'important'); }
            let sC = document.getElementById('lune-cache-vrai-ciel'); if (sC) { sC.style.setProperty('background', '#05080c', 'important'); }
            let appliquerVraieOmbreCurvee = (element) => { if (!element) return; element.style.left = "0%"; element.style.width = "100%"; if (daysSinceNew < 14.765) { let doublePct = Math.max(0, 100 - (pct * 2)); element.style.setProperty('clip-path', `ellipse(${doublePct}% 100% at 100% 50%)`, 'important'); } else { let doublePct = Math.max(0, 100 - (pct * 2)); element.style.setProperty('clip-path', `ellipse(${doublePct}% 100% at 0% 50%)`, 'important'); } };
            appliquerVraieOmbreCurvee(sW); appliquerVraieOmbreCurvee(sC);
            let nom = "Nouvelle lune"; if(daysSinceNew >= 1.5 && daysSinceNew < 6.5) nom = "Premier croissant"; else if(daysSinceNew >= 6.5 && daysSinceNew < 8.5) nom = "Premier quartier"; else if(daysSinceNew >= 8.5 && daysSinceNew < 13.5) nom = "Gibbeuse croissante"; else if(daysSinceNew >= 13.5 && daysSinceNew < 15.5) nom = "Pleine lune"; else if(daysSinceNew >= 15.5 && daysSinceNew < 22.0) nom = "Gibbeuse décroissante"; else if(daysSinceNew >= 22.0 && daysSinceNew < 24.0) nom = "Dernier quartier"; else if(daysSinceNew >= 24.0 && daysSinceNew < 28.0) nom = "Dernier croissant"; document.getElementById('lune-phase-nom').textContent = nom;
        }
        setInterval(actualiserHorloge, 1000); actualiserHorloge(); setTimeout(calculPhaseLune, 500); executerMeteo(); setInterval(executerMeteo, 900000);
