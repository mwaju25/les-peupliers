<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ecran Master Connected - Les Peupliers</title>
<style>
* {box-sizing:border-box;margin:0;padding:0;font-family:'Arial Black',sans-serif;}
body {background-color:#000;color:#fff;height:100vh;width:100vw;overflow:hidden;position:relative;}
#school-view-bg,.decor-permanent {position:fixed;top:0;left:0;width:100vw;height:100vh;background:url('fond-final.png') no-repeat center center !important;background-size:100% 100% !important;z-index:-6 !important;transition:filter 8s ease-in-out;}
#school-view-bg::after,.decor-permanent::after {content:'';position:absolute;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.45) !important;pointer-events:none;}
#sky-gradient {position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-5 !important;mix-blend-mode:overlay !important;clip-path:inset(0 0 35vh 15vw) !important;transition:background 8s ease-in-out;pointer-events:none;}
.lune-dans-le-ciel {position:fixed;top:11vh;right:20vw;width:4.5vw;height:4.4vw;border-radius:50%;background-image:url('https://wikimedia.org') !important;background-size:cover;background-position:center;border:1.5px solid rgba(255,255,255,0.4) !important;box-shadow:0 0 15px rgba(255,255,255,0.35);filter:grayscale(1) brightness(1.2);z-index:-4;display:none;overflow:hidden;transition:opacity 8s ease-in-out;}
.cache-lune-ciel {position:absolute;top:0;width:100%;height:100%;background:rgba(5,8,12,0.92);}
#cloud-layer {position:fixed;top:0;left:0;width:200vw;height:38vh;background:url('https://wikimedia.org') repeat-x;background-size:contain;z-index:-3;opacity:0;pointer-events:none;transition:opacity 5s ease-in-out;}
#lightning-flash {position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;background:rgba(255,255,255,0);pointer-events:none;}
#back-precipitations {position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-2;pointer-events:none;}
#front-particles {position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-2 !important;pointer-events:none;}
.pos {position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;}
.boite-flip-haut {background:linear-gradient(to bottom,#11151c,#05070a) !important;border:2px solid #28303d !important;border-radius:8px !important;box-shadow:0px 6px 12px rgba(0,0,0,0.5),inset 0px 0px 10px rgba(0,0,0,0.9) !important;z-index:99 !important;}
.flip-tuile-js {width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.3vw;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:1px;position:relative;}
.flip-tuile-js::after {content:'';position:absolute;left:0;top:50%;width:100%;height:0.8px;background:#000000 !important;border-bottom:1px solid rgba(255,255,255,0.12) !important;z-index:5;}
.charniere-gauche,.charniere-droite {position:absolute;top:50%;transform:translateY(-50%);width:12px;height:24px;z-index:10;background:linear-gradient(to right,#444,#d1d1d1,#fff 40%,#d1d1d1 70%,#333) !important;border-radius:3px !important;border:1px solid #111 !important;box-shadow:0 3px 5px rgba(0,0,0,0.4) !important;}
.charniere-gauche {left:-6px !important;} .charniere-droite {right:-6px !important;}
.charniere-gauche::after {content:'';position:absolute;top:4px;width:4px;height:14px;background:#161a22 !important;left:-3px;border:1px solid #050505 !important;}
.charniere-droite::after {content:'';position:absolute;top:4px;width:4px;height:14px;background:#161a22 !important;right:-3px;border:1px solid #050505 !important;}
.charniere-gauche::before,.charniere-droite::before {content:'';position:absolute;left:0;top:10px;width:100%;height:4px;background:#111 !important;}
.montre-retro-cercle {position:absolute;right:2.2vw;top:1vh;width:15.6vw;height:15.6vw;background:#000000 !important;border:2px solid #1d2633 !important;border-radius:50%;box-shadow:0px 4px 12px rgba(0,0,0,0.5);z-index:99 !important;}
.graduation {position:absolute;width:2px;height:8px;background:rgba(255,255,255,0.4);left:50%;top:2px;margin-left:-1px;transform-origin:50% 7.6vw;z-index:11;}
.graduation.principale {width:3px;height:12px;background:#ffffff !important;top:2px;}
.chiffre-container-js {position:absolute;width:2vw;height:2vw;left:50%;top:12px;margin-left:-1vw;transform-origin:50% 6.6vw;display:flex;align-items:center;justify-content:center;z-index:12;}
.chiffre-cadran-fixe {font-size:0.95vw;font-weight:bold;color:#ffffff !important;font-family:'Arial Black',sans-serif;}
.aiguille {position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:4px;z-index:13;}
.heure {width:5px;height:3.2vw;background-color:#fff;} .minute {width:4px;height:4.9vw;background-color:#8ad400;}
.pivot {position:absolute;width:12px;height:12px;background:#a2f200;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;box-shadow:0 0 6px rgba(162,242,0,0.8);}
.boite-digitale-bas {position:absolute;right:2vw;top:35.5vh;width:17vw;height:8vh;background:#05070a !important;border:none !important;border-radius:8px;box-shadow:inset 0 0 10px rgba(0,0,0,0.8) !important;z-index:99 !important;}
.heure-digitale-js {font-size:2.7vw;font-weight:900;color:#ffffff !important;letter-spacing:1px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.heure-digitale-js::after {content:'';position:absolute;left:0;top:50%;width:100%;height:0.8px;background:#000000;border-bottom:1px solid rgba(255,255,255,0.12);z-index:5;}
.cadran-relief-bleu {background:#0d131a !important;border:2px solid #212c3a !important;border-radius:12px !important;box-shadow:0 8px 16px rgba(0,0,0,0.7),inset 0 0 12px rgba(0,0,0,0.8) !important;opacity:1 !important;z-index:99 !important;transition:border-color 8s ease-in-out,box-shadow 8s ease-in-out;}
.cadran-relief-noir-bloc {background:#05080c !important;border:2px solid #162029 !important;border-radius:12px;box-shadow:0 6px 12px rgba(0,0,0,0.6);z-index:99 !important;transition:border-color 8s ease-in-out,box-shadow 8s ease-in-out;overflow:hidden;}
.carte-prev-unique {width:10.4vw;height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:1.5vh 0;background:#0d131a !important;border:2px solid #212c3a !important;border-radius:12px !important;}
.soleil-realiste-css {width:3.2vw;height:3.2vw;background:radial-gradient(circle,#fff 15%,#ffea00 55%,#ff7700 100%);border-radius:50%;box-shadow:0 0 18px rgba(255,210,0,0.75),0 0 35px rgba(255,100,0,0.4);}
.lune-doree-image {position:relative;width:4.4vw;height:4.4vw;border-radius:50%;background-image:url('https://wikimedia.org') !important;background-size:cover;background-position:center;border:1.5px solid rgba(255,255,255,0.4) !important;box-shadow:0 0 14px rgba(255,255,255,0.35);filter:grayscale(1) brightness(1.2);display:block;overflow:hidden;}
.cache-ombre-lunaire {position:absolute;top:0;left:0;width:100%;height:100%;background:#05080c;border-radius:50%;opacity:0.85;transition:all 0.5s ease-in-out;}
.case-illustration-pommier {width:4.8vw;height:4.8vw;position:relative;display:flex;align-items:center;justify-content:center;background:#121b24 !important;border-radius:8px;border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 0 6px rgba(0,0,0,0.6);}
.pommier-trunk {position:absolute;width:4px;background:#5c4033;bottom:0.2vw;height:1.8vw;left:50%;transform:translateX(-50%);border-radius:2px;}
.pommier-branch-l {position:absolute;width:10px;height:2px;background:#5c4033;bottom:1.4vw;left:1.2vw;transform:rotate(-30deg);}
.pommier-branch-r {position:absolute;width:10px;height:2px;background:#5c4033;bottom:1.6vw;right:1.2vw;transform:rotate(30deg);}
.pommier-canopy {position:absolute;border-radius:50%;background:#2e7d32;width:2.8vw;height:2.8vw;bottom:1.6vw;left:50%;transform:translateX(-50%);}
.pommier-fruit {position:absolute;width:5px;height:5px;background:#d32f2f;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,0.4);}
.picto-pro-meteo {position:relative;width:4.8vw;height:4.8vw;display:flex;align-items:center;justify-content:center;}
.picto-pro-meteo .soleil-centre {width:2.2vw;height:2.2vw;background:#ffea00;border-radius:50%;box-shadow:0 0 15px #ffdf00;}
.picto-pro-meteo .nuage-face {position:absolute;width:3.2vw;height:1.6vw;background:#ffffff;border-radius:20px;bottom:0.8vw;left:0.8vw;box-shadow:0 4px 6px rgba(0,0,0,0.4);}
.picto-pro-meteo .nuage-face::before {content:'';position:absolute;width:1.6vw;height:1.6vw;background:#ffffff;border-radius:50%;top:-0.8vw;left:0.5vw;}
.picto-pro-meteo .nuage-face::after {content:'';position:absolute;width:1.2vw;height:1.2vw;background:#ffffff;border-radius:50%;top:-0.5vw;right:0.5vw;}
.picto-pro-mini {scale:0.65;display:inline-block;vertical-align:middle;}
.goutte-particule {position:absolute;background:rgba(255,255,255,0.4);width:1.5px;height:20px;animation:flowChute linear infinite;}
@keyframes flowChute {0% {transform:translateY(-5vh) translateX(0);}100% {transform:translateY(105vh) translateX(var(--wind-x));}}
@keyframes cloudMove {0% {transform:translateX(0);}100% {transform:translateX(-100vw);}}
.anim-clouds {animation:cloudMove linear infinite var(--cloud-speed);}
#logo-ecran-principal,.logo-etablissement-peupliers {position:absolute;left:1.1vw;top:1vh;width:14vw;height:14vw;background:url('logo.png') no-repeat center center !important;background-size:contain !important;z-index:101 !important;mix-blend-mode:screen !important;filter:none !important;display:block !important;opacity:1 !important;}
#slogan-ecran-principal,.slogan-peupliers-texte {position:absolute;left:17.5vw;top:14vh;width:60vw;font-size:1.6vw;color:#8ad400;font-weight:bold;text-align:left;text-transform:uppercase;letter-spacing:0.5px;z-index:101 !important;filter:none !important;mix-blend-mode:normal !important;opacity:1 !important;}
</style>
</head>
