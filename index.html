<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecran Dynamique - Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            position: relative;
        }

        /* CHARGEMENT FORCE DU GRAPHISME PAR ADRESSE ABSOLUE INTERNET */
        .fond-global {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://github.io');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }
        
        header { display: flex; justify-content: space-between; align-items: center; height: 14vh; position: relative; z-index: 10; }
        
        .flip-tuile-js { font-size: 2.3rem; font-weight: bold; color: #fff; text-transform: uppercase; }
        .heure-digitale-js { font-size: 2.2rem; font-weight: bold; color: #fff; letter-spacing: 4px; }

        /* DOUBLE SYSTEME HORLOGER : LES AIGUILLES DE L'ANALOGIQUE */
        .cadran-aiguilles {
            position: absolute;
            right: 114px;
            top: 25px;
            width: 110px;
            height: 110px;
            background: transparent;
        }
        .aiguille {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            z-index: 15;
        }
        .heure { width: 4px; height: 32px; background-color: #fff; }
        .minute { width: 3px; height: 44px; background-color: #8ad400; }

        main { display: flex; justify-content: space-between; height: 64vh; margin: 10px 0; position: relative; z-index: 10; }
        .colonne-gauche { width: 26%; background: transparent; }
        .colonne-droite { width: 22%; background: transparent; display: flex; flex-direction: column; gap: 10px; }
        .espace-central-libre { width: 50%; pointer-events: none; }

        .text-dynamique-transparent { color: #fff; font-weight: bold; padding: 2px 5px; display: inline-block; }

        footer { height: 18vh; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 10; }

        .particule-feuille { position: absolute; width: 14px; height: 9px; background: #628c34; border-radius: 0 75% 0 75%; opacity: 0.65; animation: animationVent linear infinite; }
        @keyframes animationVent {
            0% { transform: translate(-40px, 0px) rotate(0deg); }
            100% { transform: translate(55vw, 180px) rotate(540deg); }
        }
    </style>
</head>
<body>

    <!-- RECOUVREMENT DU VISUEL COMPLET AVEC LES EFFETS -->
    <div id="fond-ecran-principal" class="fond-global"></div>

    <div id="zone-feuilles-dynamiques" style="position: fixed; top: 20vh; left: 28vw; width: 46vw; height: 55vh; pointer-events: none; z-index: 2; overflow: hidden;"></div>

    <header>
        <div style="width: 135px; height: 135px; background: transparent;"></div>
        
        <!-- CALENDRIER FLIP-FLAP COUPLÉ -->
        <div style="display: flex; gap: 42px; position: absolute; left: 24.5%; top: 22px;">
            <div class="flip-tuile-js" id="date-jour">SAMEDI</div>
            <div class="flip-tuile-js" id="date-num">29</div>
            <div class="flip-tuile-js" id="date-mois">AOÛT</div>
            <div class="flip-tuile-js" id="date-annee">2026</div>
        </div>

        <!-- CADRAN 1 : L'HORLOGE ANALOGIQUE (AIGUILLES SUR VOTRE MONTRE) -->
        <div class="cadran-aiguilles">
            <div class="aiguille heure" id="needle-hour"></div>
            <div class="aiguille minute" id="needle-minute"></div>
        </div>
        
        <!-- CADRAN 2 : L'HORLOGE DIGITALE (CHIFFRES SUR LE TEXTE FLIP) -->
        <div style="position: absolute; right: 54px; top: 142px;">
            <div class="heure-digitale-js" id="horloge-texte">13:05:25</div>
        </div>
    </header>

    <main>
        <div class="colonne-gauche">
            <div style="position: absolute; left: 65px; top: 85px; font-size: 3.5rem;" id="icone-meteo-courante">☁️</div>
            <div style="position: absolute; left: 45px; top: 155px; font-size: 4rem; font-weight: bold;" id="temp-meteo-courante">19°C</div>
        </div>

        <div class="espace-central-libre"></div>

        <div class="colonne-droite">
            <div style="position: absolute; right: 55px; top: 15px;"><span class="text-dynamique-transparent" id="val-saison">ÉTÉ 🌱</span></div>
            <div style="position: absolute; right: 35px; top: 102px; font-size: 0.95rem;"><span class="text-dynamique-transparent" id="val-lever">06:49</span></div>
            <div style="position: absolute; right: 35px; top: 128px; font-size: 0.95rem;"><span class="text-dynamique-transparent" id="val-coucher">20:30</span></div>
            <div style="position: absolute; right: 25px; top: 225px; font-size: 0.85rem;"><span class="text-dynamique-transparent" id="val-lune">Pleine lune (100%)</span></div>
        </div>
    </main>

    <footer></footer>

    <script>
        function actualiserEcran() {
            var tempsReel = new Date();
            
            // Logique de l'horloge digitale
            var h = tempsReel.getHours();
            var m = tempsReel.getMinutes();
            var s = tempsReel.getSeconds();
            document.getElementById('horloge-texte').textContent = h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
            
            // Logique des aiguilles analogiques synchronisées
            var degHeure = (h % 12) * 30 + m * 0.5;
            var degMinute = m * 6;
            document.getElementById('needle-hour').style.transform = 'translateX(-50%) rotate(' + degHeure + 'deg)';
            document.getElementById('needle-minute').style.transform = 'translateX(-50%) rotate(' + degMinute + 'deg)';

            var listeJours = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'];
            var listeMois = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCÉMBRE'];
            
            document.getElementById('date-jour').textContent = listeJours[tempsReel.getDay()];
            document.getElementById('date-num').textContent = tempsReel.getDate();
            document.getElementById('date-mois').textContent = listeMois[tempsReel.getMonth()];
            document.getElementById('date-annee').textContent = tempsReel.getFullYear();
        }
        
        setInterval(actualiserEcran, 1000);
        actualiserEcran();

        var conteneurFeuilles = document.getElementById('zone-feuilles-dynamiques');
        function lancerFeuille() {
            var feuille = document.createElement('div');
            feuille.classList.add('particule-feuille');
            feuille.style.top = (Math.random() * 90) + '%';
            feuille.style.left = '-20px';
            feuille.style.animationDuration = (Math.random() * 2.5 + 3.5) + 's';
            conteneurFeuilles.appendChild(feuille);
            setTimeout(function() { feuille.remove(); }, 6000);
        }
        setInterval(lancerFeuille, 1800);
    </script>
</body>
</html>
