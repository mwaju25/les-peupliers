<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ecran Master Connected - Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        #school-view-bg, .decor-permanent { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('fond-final.png') no-repeat center center !important; background-size: 100% 100% !important; z-index: -6 !important; transition: filter 8s ease-in-out; }
        #school-view-bg::after, .decor-permanent::after { content: ''; position: absolute; inset: 0; background: transparent; pointer-events: none; }
        #sky-gradient { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -5 !important; mix-blend-mode: normal !important; opacity: .58; transition: background 8s ease-in-out, opacity 8s ease-in-out; pointer-events: none; }
        .lune-dans-le-ciel { position: fixed; top: 11vh; right: 20vw; width: 4.5vw; height: 4.4vw; border-radius: 50%; background-image: radial-gradient(circle at 35% 35%,#fff 0 12%,#d8dbe0 42%,#8f9399 100%) !important; background-size: cover; background-position: center; border: 1.5px solid rgba(255,255,255,0.4) !important; box-shadow: 0 0 15px rgba(255,255,255,0.35); filter: grayscale(1) brightness(1.2); z-index: -4; display: none; overflow: hidden; transition: opacity 8s ease-in-out; }
        .cache-lune-ciel { position: absolute; top: 0; width: 100%; height: 100%; background: rgba(5,8,12,0.92); }
        #cloud-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -4; opacity: 0; pointer-events: none; transition: opacity 4s ease-in-out; overflow:hidden; }
        #cloud-layer::before,#cloud-layer::after{content:'';position:absolute;top:4vh;left:-30vw;width:160vw;height:28vh;background:radial-gradient(ellipse at 15% 55%,rgba(255,255,255,.48) 0 8%,transparent 20%),radial-gradient(ellipse at 35% 45%,rgba(255,255,255,.36) 0 10%,transparent 24%),radial-gradient(ellipse at 58% 55%,rgba(255,255,255,.42) 0 9%,transparent 22%),radial-gradient(ellipse at 80% 45%,rgba(255,255,255,.30) 0 8%,transparent 20%);filter:blur(12px);animation:cloudMove 70s linear infinite;}
        #cloud-layer::after{top:10vh;opacity:.45;animation-duration:105s;animation-direction:reverse;filter:blur(18px);}
        #lightning-flash { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events:none; overflow:hidden; }
        .lightning-bolt{position:absolute;top:3vh;left:var(--lx);width:var(--lw);height:var(--lh);filter:drop-shadow(0 0 7px rgba(220,245,255,.95));opacity:0;transform-origin:top center;}
        .lightning-bolt svg{width:100%;height:100%;overflow:visible;}
        .lightning-bolt path{fill:none;stroke:#f7fdff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;}
        .lightning-bolt .branch{stroke-width:1.25;opacity:.88;}
        .lightning-bolt.strike{animation:boltStrike .42s steps(3,end) forwards;}
        @keyframes boltStrike{0%,10%{opacity:0}12%{opacity:1}22%{opacity:.1}30%{opacity:1}43%{opacity:0}100%{opacity:0}}
        #back-precipitations { position: fixed; inset:0; width:100vw; height:100vh; z-index: -3; pointer-events:none; }
        #front-particles { position: fixed; inset:0; width:100vw; height:100vh; z-index: 40 !important; pointer-events:none; overflow:hidden; }
        .pos { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; }
        .boite-flip-haut { background: linear-gradient(to bottom, #11151c, #05070a) !important; border: 2px solid #28303d !important; border-radius: 8px !important; box-shadow: 0px 6px 12px rgba(0,0,0,0.5), inset 0px 0px 10px rgba(0,0,0,0.9) !important; z-index: 99 !important; }
        .flip-tuile-js { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.3vw; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; position: relative; }
        .flip-tuile-js::after { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 0.8px; background: #000000 !important; border-bottom: 1px solid rgba(255,255,255,0.12) !important; z-index: 5; }
        .charniere-gauche, .charniere-droite { position: absolute; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; z-index: 10; background: linear-gradient(to right, #444, #d1d1d1, #fff 40%, #d1d1d1 70%, #333) !important; border-radius: 3px !important; border: 1px solid #111 !important; box-shadow: 0 3px 5px rgba(0,0,0,0.4) !important; }
        .charniere-gauche { left: -6px !important; } .charniere-droite { right: -6px !important; }
        .charniere-gauche::after { content: ''; position: absolute; top: 4px; width: 4px; height: 14px; background: #161a22 !important; left: -3px; border: 1px solid #050505 !important; }
        .charniere-droite::after { content: ''; position: absolute; top: 4px; width: 4px; height: 14px; background: #161a22 !important; right: -3px; border: 1px solid #050505 !important; }
        .charniere-gauche::before, .charniere-droite::before { content: ''; position: absolute; left: 0; top: 10px; width: 100%; height: 4px; background: #111 !important; }
        .montre-retro-cercle { position: absolute; right: 2.2vw; top: 1vh; width: 15.6vw; height: 15.6vw; background: #000000 !important; border: 2px solid #1d2633 !important; border-radius: 50%; box-shadow: 0px 4px 12px rgba(0,0,0,0.5); z-index: 99 !important; }
        .graduation { position: absolute; width: 2px; height: 8px; background: rgba(255,255,255,0.4); left: 50%; top: 2px; margin-left: -1px; transform-origin: 50% 7.6vw; z-index: 11; }
        .graduation.principale { width: 3px; height: 12px; background: #ffffff !important; top: 2px; }
        .chiffre-container-js { position: absolute; width: 2vw; height: 2vw; left: 50%; top: 12px; margin-left: -1vw; transform-origin: 50% 6.6vw; display: flex; align-items: center; justify-content: center; z-index: 12; }
        .chiffre-cadran-fixe { font-size: 0.95vw; font-weight: bold; color: #ffffff !important; font-family: 'Arial Black', sans-serif; }
        .aiguille { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 4px; z-index: 13; }
        .heure { width: 5px; height: 3.2vw; background-color: #fff; } .minute { width: 4px; height: 4.9vw; background-color: #8ad400; }
        .pivot { position: absolute; width: 12px; height: 12px; background: #a2f200; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 15; box-shadow: 0 0 6px rgba(162,242,0,0.8); }
        .boite-digitale-bas { position: absolute; right: 2vw; top: 35.5vh; width: 17vw; height: 8vh; background: #05070a !important; border: none !important; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8) !important; z-index: 99 !important; }
        .heure-digitale-js { font-size: 2.7vw; font-weight: 900; color: #ffffff !important; letter-spacing: 1px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        .heure-digitale-js::after { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 0.8px; background: #000000; border-bottom: 1px solid rgba(255,255,255,0.12); z-index: 5; }
        .cadran-relief-bleu { position:relative;  background: #0d131a !important; border: 2px solid #212c3a !important; border-radius: 12px !important; box-shadow: 0 8px 16px rgba(0,0,0,0.7), inset 0 0 12px rgba(0,0,0,0.8) !important; opacity: 1 !important; z-index: 99 !important; transition: border-color 8s ease-in-out, box-shadow 8s ease-in-out; }
        .cadran-relief-noir-bloc { position:relative;  background: #05080c !important; border: 2px solid #162029 !important; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.6); z-index: 99 !important; transition: border-color 8s ease-in-out, box-shadow 8s ease-in-out; overflow: hidden; }
        .carte-prev-unique { position:relative; z-index:100; width: 10.4vw; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 1.5vh 0; background: #0d131a !important; border: 2px solid #212c3a !important; border-radius: 12px !important; }
        .soleil-realiste-css { width: 3.2vw; height: 3.2vw; background: radial-gradient(circle, #fff 15%, #ffea00 55%, #ff7700 100%); border-radius: 50%; box-shadow: 0 0 18px rgba(255,210,0,0.75), 0 0 35px rgba(255,100,0,0.4); }
        .lune-doree-image { position: relative; width: 4.4vw; height: 4.4vw; border-radius: 50%; background-image: radial-gradient(circle at 35% 35%,#fff 0 12%,#d8dbe0 42%,#8f9399 100%) !important; background-size: cover; background-position: center; border: 1.5px solid rgba(255,255,255,0.4) !important; box-shadow: 0 0 14px rgba(255,255,255,0.35); filter: grayscale(1) brightness(1.2); display: block; overflow: hidden; }
        .cache-ombre-lunaire { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #05080c; border-radius: 50%; opacity: 0.85; transition: all 0.5s ease-in-out; }
        .case-illustration-pommier { width: 4.8vw; height: 4.8vw; position: relative; display: flex; align-items: center; justify-content: center; background: #121b24 !important; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 0 6px rgba(0,0,0,0.6); }
        .pommier-trunk { position: absolute; width: 4px; background: #5c4033; bottom: 0.2vw; height: 1.8vw; left: 50%; transform: translateX(-50%); border-radius: 2px; }
        .pommier-branch-l { position: absolute; width: 10px; height: 2px; background: #5c4033; bottom: 1.4vw; left: 1.2vw; transform: rotate(-30deg); }
        .pommier-branch-r { position: absolute; width: 10px; height: 2px; background: #5c4033; bottom: 1.6vw; right: 1.2vw; transform: rotate(30deg); }
        .pommier-canopy { position: absolute; border-radius: 50%; background: #2e7d32; width: 2.8vw; height: 2.8vw; bottom: 1.6vw; left: 50%; transform: translateX(-50%); }
        .pommier-fruit { position: absolute; width: 5px; height: 5px; background: #d32f2f; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
        .picto-pro-meteo { position: relative; width: 4.8vw; height: 4.8vw; display: flex; align-items: center; justify-content: center; }
        .picto-pro-meteo .soleil-centre { width: 2.2vw; height: 2.2vw; background: #ffea00; border-radius: 50%; box-shadow: 0 0 15px #ffdf00; }
        .picto-pro-meteo .nuage-face { position: absolute; width: 3.2vw; height: 1.6vw; background: #ffffff; border-radius: 20px; bottom: 0.8vw; left: 0.8vw; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
        .picto-pro-meteo .nuage-face::before { content:''; position: absolute; width: 1.6vw; height: 1.6vw; background: #ffffff; border-radius: 50%; top: -0.8vw; left: 0.5vw; }
        .picto-pro-meteo .nuage-face::after { content:''; position: absolute; width: 1.2vw; height: 1.2vw; background: #ffffff; border-radius: 50%; top: -0.5vw; right: 0.5vw; }
        .picto-pro-mini { scale: 0.65; display: inline-block; vertical-align: middle; }
        .feuille-peuplier-svg { position:absolute; width:13px; height:13px; background:var(--leaf-color); border-radius:2px 75% 60% 75%; transform-origin:center; animation:flowWind linear infinite; box-shadow:0 1px 2px rgba(0,0,0,.35); }
        .goutte-particule { position:absolute; background:linear-gradient(to bottom,rgba(210,240,255,.12),rgba(160,220,255,.78)); width:1.4px; height:24px; animation:flowChute linear infinite; filter:drop-shadow(0 0 2px rgba(100,190,255,.25)); }
        .flocon-particule { position:absolute; color:#fff; animation:flowChute linear infinite; width:9px; height:9px; font-size:10px; text-shadow:0 0 5px #fff; }
        @keyframes flowChute { 0% { transform: translateY(-5vh) translateX(0); } 100% { transform: translateY(105vh) translateX(var(--wind-x)); } }
        @keyframes flowWind { 0% { transform: translate(-5vw, var(--start-y)) rotate(0deg); } 100% { transform: translate(105vw, var(--end-y)) rotate(1080deg); } }
        @keyframes cloudMove { 0% { transform: translateX(0); } 100% { transform: translateX(-100vw); } }
        .anim-clouds { animation: cloudMove linear infinite var(--cloud-speed); }
        #season-layer{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;transition:opacity 6s ease;}
        #season-layer::before{content:'';position:absolute;inset:0;background:transparent;transition:background 6s ease,opacity 6s ease;}
        .stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.5px);background-size:57px 53px;opacity:.45;}
        #season-ground{position:absolute;left:0;right:0;bottom:0;height:27vh;opacity:0;transition:opacity 6s ease;pointer-events:none;}
        .autumn-leaf-ground{position:absolute;width:8px;height:5px;border-radius:75% 10% 75% 10%;transform:rotate(var(--r));background:var(--c);box-shadow:0 1px 2px rgba(0,0,0,.3);}
        #winter-snow{position:absolute;inset:0;opacity:0;transition:opacity 6s ease;pointer-events:none;}
        #winter-snow::before{content:'';position:absolute;left:0;right:0;bottom:0;height:24vh;background:linear-gradient(to top,rgba(245,249,255,.78),rgba(255,255,255,.25) 48%,transparent);clip-path:polygon(0 38%,8% 31%,16% 44%,25% 35%,35% 48%,45% 36%,56% 46%,66% 32%,77% 43%,88% 34%,100% 42%,100% 100%,0 100%);}
        #winter-snow::after{content:'';position:absolute;left:0;right:0;top:17vh;height:17vh;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.38),rgba(255,255,255,0));opacity:.5;}
        #season-tree-icon{width:4.8vw;height:4.8vw;position:relative;display:flex;align-items:center;justify-content:center;font-size:3.5vw;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
        #weather-updated{font-size:.55vw;color:#8f9aa7;margin-top:.5vh;text-align:right;}
        .weather-detail-line{display:flex;justify-content:space-between;gap:.8vw;font-size:.62vw;color:#b8c1ca;margin-top:.35vh;}
        .weather-detail-line strong{color:#fff;font-size:.68vw;}
        .current-weather-icon{width:5.5vw;height:5.5vw;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 7px rgba(0,0,0,.35));flex:0 0 auto;}
        .current-weather-icon svg{width:5.4vw;height:5.4vw;display:block;}
        .meteo-stat{flex:1;min-width:0;}
        .meteo-stat+.meteo-stat{border-left:1px solid rgba(255,255,255,.1);}
        .meteo-label{font-size:.58vw;color:#aeb8c1;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;}
        .meteo-value{font-size:1.02vw;margin-top:.35vh;color:#fff;white-space:nowrap;}
        #season-tree-icon{width:4.8vw;height:4.8vw;display:flex;align-items:center;justify-content:center;}
        #season-tree-icon svg{width:4.8vw;height:4.8vw;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.38));}
        #sky-gradient{clip-path:polygon(0 0,100% 0,100% 48%,92% 46%,84% 49%,76% 45%,68% 48%,60% 44%,52% 48%,44% 45%,36% 48%,28% 44%,20% 47%,12% 44%,0 48%) !important;}
        #cloud-layer{clip-path:polygon(0 0,100% 0,100% 46%,92% 44%,84% 47%,76% 43%,68% 46%,60% 42%,52% 46%,44% 43%,36% 46%,28% 42%,20% 45%,12% 42%,0 46%);}
                #logo-ecran-principal, .logo-etablissement-peupliers { position: absolute; left: 1.1vw; top: 1vh; width: 14vw; height: 14vw; background:none !important; z-index:101 !important; display:none !important; opacity:0 !important; }
        #slogan-ecran-principal, .slogan-peupliers-texte { position: absolute; left: 17.5vw; top: 14vh; width: 60vw; font-size: 1.6vw; color: #8ad400; font-weight: bold; text-align: left; text-transform: uppercase; letter-spacing: 0.5px; z-index: 101 !important; filter: none !important; mix-blend-mode: normal !important; opacity: 1 !important; }
    
        /* --- CALQUES DYNAMIQUES : fond original toujours visible --- */
        #school-view-bg, .decor-permanent { z-index:0 !important; filter:none !important; background-size:100% 100% !important; }

<body>
    <div id="season-layer"><img id="season-weather-overlay" alt=""><div id="season-ground"></div><div id="winter-snow"></div></div>
    <div id="sky-gradient"></div>
    <div id="night-dimmer"></div>
    <div class="lune-dans-le-ciel" id="lune-vrai-ciel"><div class="cache-lune-ciel" id="lune-cache-vrai-ciel"></div></div>
    <div id="school-view-bg" class="decor-permanent"></div>
    <div id="cloud-layer"></div> <div id="lightning-flash"></div> <div id="back-precipitations"></div> <div id="front-particles"></div>
    
    <div id="logo-ecran-principal"></div>

    <div class="pos boite-flip-haut" style="left: 17.5vw; top: 2.5vh; width: 15.5vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-jour">--</div><div class="charniere-droite"></div></div>
    <div class="pos boite-flip-haut" style="left: 34.5vw; top: 2.5vh; width: 7.5vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-num">--</div><div class="charniere-droite"></div></div>
    <div class="pos boite-flip-haut" style="left: 43.5vw; top: 2.5vh; width: 23.5vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-mois">--</div><div class="charniere-droite"></div></div>
    <div class="pos boite-flip-haut" style="left: 68.5vw; top: 2.5vh; width: 11.5vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-annee">----</div><div class="charniere-droite"></div></div>

        <div class="pivot"></div> <div class="aiguille heure" id="needle-hour"></div> <div class="aiguille minute" id="needle-minute"></div>
    </div>
    <div class="boite-digitale-bas"><div class="charniere-gauche"></div><div class="heure-digitale-js" id="horloge-texte">--:--:--</div><div class="charniere-droite"></div></div>
    
    <div class="cadran-relief-bleu" id="cadran-meteo-g" style="position: absolute; left: 1.5vw; top: 25vh; width: 28.5vw; height: 35vh; padding: 1.3vw; color: #ffffff;">
        <div style="font-size: 1.1vw; color: #ffffff; font-weight: bold; margin-bottom: 2px; text-align: left;">Marloie (Marche-en-Famenne)</div>
        <div style="font-size: 0.75vw; color: #aaaaaa; text-transform: uppercase; margin-bottom: 1.2vh; letter-spacing: 1px;">MÉTÉO ACTUELLE</div>
        <div style="display:flex;align-items:center;gap:1.6vw;margin-bottom:1.1vh;">
            <div id="current-weather-icon" class="current-weather-icon"></div>

        let lastRenderedSeason='';

        function dirText(deg){const dirs=['N','NE','E','SE','S','SO','O','NO'];return dirs[Math.round(deg/45)%8]}
        function executerMeteo(){
          const u='https://api.open-meteo.com/v1/forecast?latitude=50.20&longitude=5.31&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,precipitation,rain,showers,snowfall,cloud_cover,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,snowfall_sum,wind_speed_10m_max,wind_direction_10m_dominant&forecast_days=7&timezone=Europe%2FBrussels';
          fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('API météo '+r.status);return r.json()}).then(data=>{
            weatherData=data; localStorage.setItem('lesPeupliersWeather',JSON.stringify({savedAt:Date.now(),data:data})); appliquerDonneesMeteo(data,false);
          }).catch(err=>{

        function appliquerDonneesMeteo(data,ancienne){
          weatherData=data; const c=data.current,info=weatherInfo(c.weather_code); currentWeatherCode=c.weather_code; isDay=!!c.is_day; currentCloudCover=Number(c.cloud_cover||0); weatherDescriptionGlobal=info[0]; vitesseVentActuelle=Math.round(c.wind_speed_10m||0); windDirectionActuelle=c.wind_direction_10m||0; currentSunrise=parseLocalWeatherTime(data.daily.sunrise[0]); currentSunset=parseLocalWeatherTime(data.daily.sunset[0]);
          $('courant-temp').textContent=Number(c.temperature_2m).toFixed(1)+'°C'; $('courant-ressenti').textContent='Ressentie '+Math.round(c.apparent_temperature)+'°C'; $('courant-humidite').textContent=Math.round(c.relative_humidity_2m)+'%'; $('courant-vent').textContent=`${vitesseVentActuelle} km/h ${dirText(windDirectionActuelle)}`; const uv=Math.round(c.uv_index??0); $('courant-uv').textContent=`${uv} / ${uv<3?'Bas':uv<6?'Modéré':uv<8?'Élevé':'Très élevé'}`; $('courant-desc').textContent=info[0]; $('courant-precip').textContent=`${Number(c.precipitation||0).toFixed(1)} mm`; $('weather-updated').textContent=(ancienne?'Dernières données valides — ':'')+`Actualisé à ${new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})}`; $('current-weather-icon').innerHTML=iconSvg(info[1],true);

          injecterPrevisions(data.daily); gererEffetsMeteoEtParticules(info[1]); calculPhaseLune(); gererCycleJourNuit(new Date().getHours(),new Date().getMinutes());

        function injecterPrevisions(d){

        }
        let lightningTimer=null;
        function gererEffetsMeteoEtParticules(type){
          const p=$('front-particles');p.innerHTML=''; const cloud=$('cloud-layer'); cloud.style.opacity=(type==='cloud'||type==='partly'||type==='rain'||type==='drizzle'||type==='storm'||type==='snow'||type==='fog')?'.58':'.08';

        let currentSunrise=null, currentSunset=null, currentCloudCover=0;
        function parseLocalWeatherTime(value){

        function skyForPhase(phase,code){

        function gererCycleJourNuit(h,m){
          const calque=$('sky-gradient'),decor=$('school-view-bg'),moon=$('lune-vrai-ciel'),dimmer=$('night-dimmer');
          setSeason(new Date());
          const now=new Date(), phase=getDayPhase(now), code=currentWeatherCode;
          const night=(phase==='night'||phase==='crepuscule');
          calque.style.background=skyForPhase(phase,code);
          calque.style.opacity=(phase==='day')?'.58':(phase==='night'?'.82':'.72');
          if(phase==='night') dimmer.style.background='rgba(0,5,14,.34)';
          else if(phase==='crepuscule') dimmer.style.background='rgba(0,4,12,.20)';
          else if(phase==='aube') dimmer.style.background='rgba(0,4,12,.05)';
          else dimmer.style.background='rgba(0,0,0,0)';
          const starsAllowed=night && currentCloudCover<35 && code<51;
          setStars(starsAllowed);
          moon.style.display=night?'block':'none';
          decor.style.filter='none';
        }
        function calculPhaseLune(){
          const ref=Date.UTC(2000,0,6,18,14),syn=29.530588853;
          const raw=((Date.now()-ref)/86400000)%syn; const a=raw<0?raw+syn:raw;
          const illum=Math.round((1-Math.cos(2*Math.PI*a/syn))*50);
          let nom='Nouvelle lune';
          if(a<1.5||a>=28)nom='Nouvelle lune'; else if(a<6.5)nom='Premier croissant'; else if(a<8.5)nom='Premier quartier'; else if(a<13.5)nom='Gibbeuse croissante'; else if(a<15.5)nom='Pleine lune'; else if(a<22)nom='Gibbeuse décroissante'; else if(a<24)nom='Dernier quartier'; else nom='Dernier croissant';
          $('lune-age').textContent=a.toFixed(1); $('lune-ecl').textContent=illum; $('lune-phase-nom').textContent=nom;
          const idx=Math.min(31,Math.floor((a/syn)*32+0.5)%32); const src=`assets/lune/phases/p${String(idx).padStart(2,'0')}.png`;
          const p=$('lune-vrai-photo'), c=$('lune-vrai-ciel');
          [p,c].forEach(el=>{ if(!el)return; el.style.backgroundImage=`url("${src}")`; el.style.backgroundColor='transparent'; });
        }
        function lancerEclair(){
          const host=$('lightning-flash'); if(!host)return; host.innerHTML='';
          const x=18+Math.random()*64, y=2+Math.random()*20;
          const w=12+Math.random()*10, h=42+Math.random()*28;
          const wrap=document.createElement('div'); wrap.className='lightning-bolt strike'; wrap.style.setProperty('--lx',x+'vw'); wrap.style.setProperty('--lw',w+'vw'); wrap.style.setProperty('--lh',h+'vh');
          const pts=[[50,0]]; let px=50,py=0; for(let i=0;i<7;i++){px+=Math.random()*24-12;py+=12+Math.random()*10;pts.push([Math.max(10,Math.min(90,px)),py]);}
          let path='M '+pts.map(p=>p.join(' ')).join(' L ');
          let branches=''; for(let i=2;i<pts.length-1;i++){const [bx,by]=pts[i]; const ex=bx+(Math.random()>.5?1:-1)*(10+Math.random()*16); const ey=by+10+Math.random()*13; branches+=`<path class="branch" d="M ${bx} ${by} L ${ex} ${ey}"/>`; }
          wrap.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${path}"/>${branches}</svg>`; host.appendChild(wrap);
          const halo=document.createElement('div'); halo.className='lightning-halo strike'; halo.style.setProperty('--strike-x',x+'vw'); halo.style.setProperty('--strike-y',y+'vh'); host.appendChild(halo);
          setTimeout(()=>{host.innerHTML=''; if(currentWeatherCode>=95) lightningTimer=setTimeout(lancerEclair,5000+Math.random()*9000)},650);
        }
        // Horloge analogique
        const mC=$('cadran-montre'); for(let i=1;i<=12;i++){let box=document.createElement('div');box.className='chiffre-container-js';box.style.transform=`rotate(${i*30}deg)`;let n=document.createElement('div');n.className='chiffre-cadran-fixe';n.textContent=i;n.style.transform=`rotate(${-i*30}deg)`;box.appendChild(n);mC.appendChild(box)} for(let j=0;j<60;j++){let g=document.createElement('div');g.className=j%5===0?'graduation principale':'graduation';g.style.transform=`rotate(${j*6}deg)`;mC.appendChild(g)}
        setInterval(actualiserHorloge,1000); actualiserHorloge(); calculPhaseLune(); executerMeteo(); setInterval(executerMeteo,300000); setInterval(calculPhaseLune,300000);
    </script>
