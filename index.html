<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecran Dynamique - Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .fond-global {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('fond-final.png');
            background-size: 100% 100%;
            background-position: center;
            z-index: -1;
        }

        .position-absolue {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            overflow: hidden;
            text-align: center;
        }
        
        /* DESIGN AVEC EFFET DE COUPURE FLIP-FLAP RÉGLÉ AU PIXEL */
        .flip-tuile-js {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.7rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0px 3px 5px rgba(0,0,0,0.9);
            position: relative;
        }
        .flip-tuile-js::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 5;
        }

        /* HORLOGE ANALOGIQUE : SYNCHRONISATION SUR LE CADRAN DU GRAPHISME */
        .cadran-aiguilles {
            position: absolute;
            right: 2.3vw;
            top: 2.5vh;
            width: 17.5vw;
            height: 29vh;
            background: transparent;
            z-index: 10;
        }
        .aiguille {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }
        .heure { width: 5px; height: 55px; background-color: #fff; box-shadow: 0 0 4px rgba(0,0,0,0.6); }
        .minute { width: 4px; height: 80px; background-color: #8ad400; box-shadow: 0 0 4px rgba(0,0,0,0.6); }

        /* COMPTEUR HORLOGE DIGITALE FLIP-FLAP */
        .heure-digitale-js {
            font-size: 2.9rem;
            font-weight: bold;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 5px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.9);
            width: 100%;
            text-align: center;
            position: relative;
        }
        .heure-digitale-js::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* GRILLE FIXE ET NETTE POUR LES 7 CARTES DU BAS */
        .ligne-prev-bas {
            position: absolute;
            bottom: 7.5vh;
            left: 0.6vw;
            width: 98.8vw;
            height: 25.5vh;
            display: flex;
            justify-content: space-between;
            gap: 0.6vw;
            padding: 0 0.5vw;
        }
        .carte-prev-unique {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.5vh 0;
            background: transparent;
        }

        .particule-feuille { position: absolute; width: 14px; height: 9px; background: #628c34; border-radius: 0 75% 0 75%; opacity: 0.65; animation: animationVent linear infinite; }
        @keyframes animationVent {
            0% { transform: translate(-40px, 0px) rotate(0deg); }
            100% { transform: translate(55vw, 180px) rotate(540deg); }
        }
    </style>
</head>
