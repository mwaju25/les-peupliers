<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Écran Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        #school-view-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url('fond-final.png'); background-size: cover; background-position: center; z-index: 1; }
        #sky-gradient { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; transition: background 3s ease; }
        #front-particles { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 4; pointer-events: none; overflow: hidden; }
        .goutte-particule { position: absolute; top: -10vh; width: 2px; height: 40px; background: linear-gradient(transparent, #fff); opacity: 0.7; animation: chute-pluie linear infinite; }
        @keyframes chute-pluie { 0% { transform: translateY(-50px) translateX(0); } 100% { transform: translateY(110vh) translateX(var(--wind-x)); } }
        #cloud-layer { position: absolute; top: 0; left: 0; width: 200vw; height: 40vh; background-image: url('https://wikimedia.org'); background-size: contain; opacity: 0; z-index: 2; pointer-events: none; }
        .anim-clouds { animation: glisse-nuage 120s linear infinite; }
        @keyframes glisse-nuage { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .masque-ciel-strict { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; -webkit-mask-image: url('masque-arbres.png'); -webkit-mask-size: cover; -webkit-mask-position: center; mask-image: url('masque-arbres.png'); mask-size: cover; mask-position: center; }
        #lune-vrai-ciel { position: absolute; top: 8vh; left: 45vw; width: 6.5vw; height: 6.5vw; border-radius: 50%; z-index: 1; overflow: hidden; display: none; }
        #lune-cache-vrai-ciel { position: absolute; top: 0; left: 100%; width: 100%; height: 100%; border-radius: 50%; }
        #bloc-superieur-titre { position: absolute; top: 2vh; left: 18.5vw; width: 50vw; height: 10vh; z-index: 10; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.55); padding: 0 2vw; border-radius: 16px; border: 2px solid #222; }
        .case-titre-date { color: #fff; font-size: 2.2vw; text-shadow: 2px 2px 4px #000; letter-spacing: 1px; }
        #cadran-montre { position: absolute; top: 2vh; right: 2vw; width: 14vw; height: 14vw; border-radius: 50%; background: #000; border: 5px solid #222; z-index: 10; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 15px rgba(0,0,0,0.5); }
        .needle { position: absolute; left: 50%; bottom: 50%; transform-origin: bottom center; border-radius: 4px; }
        #needle-hour { width: 4px; height: 3.5vw; background: #fff; z-index: 13; }
        #needle-minute { width: 3px; height: 5.2vw; background: #8bc34a; z-index: 12; }
        #center-pin { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 15; }
        .chiffre-container-js { position: absolute; width: 100%; height: 100%; text-align: center; }
        .chiffre-cadran-fixe { display: inline-block; color: #fff; font-size: 1vw; font-weight: bold; margin-top: 5px; }
        .graduation { position: absolute; left: 50%; width: 1px; height: 4px; background: #555; transform-origin: 0 6.7vw; }
        .graduation.principale { width: 2px; height: 8px; background: #fff; }
        #horloge-texte { position: absolute; top: 32.5vh; right: 2.2vw; width: 13.6vw; color: #fff; font-size: 2.1vw; font-weight: bold; text-align: center; background: rgba(0,0,0,0.75); padding: 0.4vh 0; border-radius: 8px; border: 1.5px solid #222; z-index: 10; letter-spacing: 1px; }
        #tapis-feuilles-automne { position: absolute; bottom: 0; left: 0; width: 100vw; height: 15vh; background-image: url('tapis-feuilles.png'); background-size: cover; opacity: 0; z-index: 3; pointer-events: none; transition: opacity 2s ease; }
        .carte-prev-unique { width: 10.4vw; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 1.5vh 0; background: rgba(10,18,30,0.72); border: 2px solid rgba(255,255,255,0.06); border-radius: 12px; backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="sky-gradient"></div>
    <div id="school-view-bg"></div>
    <div class="masque-ciel-strict">
        <div id="cloud-layer"></div>
        <div id="lune-vrai-ciel"><div id="lune-cache-vrai-ciel"></div></div>
    </div>
    <div id="tapis-feuilles-automne"></div>
    <div id="front-particles"></div>
    <div id="logo-les-peupliers" style="position: absolute; top: 1vh; left: 1vw; width: 11vw; height: 11vw; background-image: url('logo.png'); background-size: contain; background-repeat: no-repeat; z-index: 10;"></div>

    <div id="bloc-superieur-titre">
        <div class="case-titre-date" id="date-jour">--</div>
        <div class="case-titre-date" id="date-num">--</div>
        <div class="case-titre-date" id="date-mois">--</div>
        <div class="case-titre-date" id="date-annee">--</div>
    </div>

    <div id="cadran-montre">
        <div class="needle" id="needle-hour"></div>
        <div class="needle" id="needle-minute"></div>
        <div class="needle" id="needle-second" style="display:none;"></div>
        <div id="center-pin"></div>
    </div>
    <div id="horloge-texte">--:--:--</div>

    <div id="widget-meteo-courante" style="position: absolute; top: 24vh; left: 1vw; width: 22vw; height: 35vh; background: rgba(5,11,22,0.65); border: 2px solid rgba(255,255,255,0.05); border-radius: 16px; z-index: 10; padding: 2vh 1.2vw; backdrop-filter: blur(12px);">
        <div style="font-size: 0.9vw; color: #aaa; font-weight: bold; margin-bottom: 1.5vh; letter-spacing: 0.5px;">Marloie (Marche-en-Famenne)<br><span style="font-size:0.65vw; color:#666;">MÉTÉO ACTUELLE</span></div>
        <div style="display: flex; align-items: center; margin-bottom: 2.5vh;">
            <div id="courant-picto" style="width: 4.5vw; height: 4.5vw; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 12px; margin-right: 1vw;">
                <div style="width:3vw; height:3vw; background:#ffa726; border-radius:50%;"></div>
            </div>
            <div>
                <div id="courant-temp" style="font-size: 3.6vw; font-weight: bold; color: #fff; line-height: 1;">--°C</div>
                <div id="courant-desc" style="font-size: 1.1vw; color: #ddd; font-weight: bold; margin-top: 0.4vh;">Calcul...</div>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4vw; background: rgba(0,0,0,0.25); padding: 1vh 0.6vw; border-radius: 8px;">
            <div style="text-align: center;"><div style="font-size: 0.5vw; color: #888; font-weight: bold;">RESSENTI</div><div id="courant-ressenti" style="font-size: 0.9vw; font-weight: bold; color: #fff; margin-top: 2px;">--</div></div>
            <div style="text-align: center;"><div style="font-size: 0.5vw; color: #888; font-weight: bold;">HUMIDITÉ</div><div id="courant-humidite" style="font-size: 0.9vw; font-weight: bold; color: #fff; margin-top: 2px;">--</div></div>
            <div style="text-align: center;"><div style="font-size: 0.5vw; color: #888; font-weight: bold;">VENT</div><div id="courant-vent" style="font-size: 0.9vw; font-weight: bold; color: #fff; margin-top: 2px;">--</div></div>
            <div style="text-align: center;"><div style="font-size: 0.5vw; color: #888; font-weight: bold;">UV</div><div id="courant-uv" style="font-size: 0.8vw; font-weight: bold; color: #fff; margin-top: 2px;">--</div></div>
        </div>
    </div>

    <div id="satellite-cadran-saison" style="position: absolute; top: 45vh; right: 2vw; width: 13.6vw; height: 11vh; background: rgba(5,11,22,0.65); border: 2px solid rgba(255,255,255,0.05); border-radius: 12px; z-index: 10; padding: 1vh 1vw; backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center;">
        <div><div style="font-size: 0.65vw; color: #888; font-weight: bold; letter-spacing: 0.5px;">SAISON</div><div id="sat-saison" style="font-size: 1.8vw; font-weight: bold; color: #fff; margin-top: 2px; letter-spacing: 0.5px;">--</div></div>
        <div id="sat-saison-icone" style="width: 3.2vw; height: 3.2vw; background: rgba(255,255,255,0.04); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
            <div style="width:1.8vw; height:1.8vw; background:#4caf50; border-radius:50%;"></div>
        </div>
    </div>

    <div id="satellite-cadran-soleil" style="position: absolute; top: 58vh; right: 2vw; width: 13.6vw; height: 11vh; background: rgba(5,11,22,0.65); border: 2px solid rgba(255,255,255,0.05); border-radius: 12px; z-index: 10; padding: 1vh 1vw; backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center;">
        <div><div style="font-size: 0.65vw; color: #888; font-weight: bold; letter-spacing: 0.5px;">SOLEIL</div>
            <div style="display: flex; gap: 0.8vw; margin-top: 6px;">
                <div><span style="font-size:0.5vw; color:#666; display:block; font-weight:bold;">LEVER</span><span id="sat-lever" style="font-size:0.85vw; font-weight:bold; color:#fff;">--:--</span></div>
                <div><span style="font-size:0.5vw; color:#666; display:block; font-weight:bold;">COUCHER</span><span id="sat-coucher" style="font-size:0.85vw; font-weight:bold; color:#fff;">--:--</span></div>
            </div>
        </div>
        <div style="width: 3.2vw; height: 3.2vw; background: rgba(255,255,255,0.04); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
            <div style="width:1.8vw; height:1.8vw; background:#ffeb3b; border-radius:50%;"></div>
        </div>
    </div>

    <div id="widget-astronomie-lune" style="position: absolute; top: 71vh; right: 2vw; width: 13.6vw; height: 17vh; background: rgba(5,11,22,0.65); border: 2px solid rgba(255,255,255,0.05); border-radius: 12px; z-index: 10; padding: 1.5vh 1vw; backdrop-filter: blur(12px);">
        <div style="font-size: 0.65vw; color: #888; font-weight: bold; margin-bottom: 1.2vh; letter-spacing: 0.5px;">LUNE</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="width: 6.2vw;">
                <div id="lune-phase-nom" style="font-size: 0.8vw; font-weight: bold; color: #fff; line-height: 1.2; height: 2.4vw; display: flex; align-items: center;">Calcul...</div>
                <div style="font-size: 0.6vw; color: #aaa; font-weight: bold; margin-top: 0.6vh;">Âge : <span id="lune-age" style="color:#fff;">--</span> j</div>
                <div style="font-size: 0.6vw; color: #aaa; font-weight: bold;">Éclairement : <span id="lune-ecl" style="color:#fff;">--</span>%</div>
            </div>
            <div id="lune-vrai-photo" style="width: 4.2vw; height: 4.2vw; border-radius: 50%; background: #000; position: relative; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.9);">
                <div id="lune-ombre-widget" style="position: absolute; top: 0; left: 100%; width: 100%; height: 100%; background: rgba(5,11,22,0.85); z-index: 2;"></div>
            </div>
        </div>
    </div>

    <div id="bandeau-inferieur-defilant" style="position: absolute; bottom: 2vh; left: 7vw; width: 73.5vw; height: 3.5vh; background: rgba(0,0,0,0.6); border-radius: 30px; border: 1.5px solid #151515; z-index: 10; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 0 2vw;">
        <div style="color: #fff; font-size: 1.1vw; font-style: italic; letter-spacing: 0.5px; opacity: 0.85; text-align: center; width: 100%; font-weight: bold;">
            Un environnement stimulant pour un avenir prometteur
        </div>
    </div>
    <div style="position: absolute; left: 1.5vw; bottom: 3vh; width: 77.5vw; height: 22vh; display: flex !important; justify-content: space-between !important; z-index: 99999 !important; overflow: visible !important;" id="zone-7-jours"></div>

    <script>
        var vitesseVentActuelle = 11; var currentSaison = "ÉTÉ"; var weatherDescriptionGlobal = "Nuageux";
        var mC = document.getElementById('cadran-montre');
        for (var i = 1; i <= 12; i++) {
            var box = document.createElement('div'); box.className = 'chiffre-container-js'; box.style.transform = 'rotate(' + (i * 30) + 'deg)';
            var n = document.createElement('div'); n.className = 'chiffre-cadran-fixe'; n.textContent = i; n.style.transform = 'rotate(' + (-i * 30) + 'deg)';
            box.appendChild(n); mC.appendChild(box);
        }
        for (var j = 0; j < 60; j++) {
            var g = document.createElement('div'); g.className = (j % 5 === 0) ? 'graduation principale' : 'graduation'; g.style.transform = 'rotate(' + (j * 6) + 'deg)'; mC.appendChild(g);
        }
        function actualiserHorloge() {
            var tempsReel = new Date(); var h = tempsReel.getHours(); var m = tempsReel.getMinutes(); var s = tempsReel.getSeconds();
            document.getElementById('horloge-texte').textContent = h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
            document.getElementById('needle-hour').style.transform = 'translateX(-50%) rotate(' + ((h % 12) * 30 + m * 0.5) + 'deg)';
            document.getElementById('needle-minute').style.transform = 'translateX(-50%) rotate(' + (m * 6) + 'deg)';
            document.getElementById('date-jour').textContent = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'][tempsReel.getDay()];
            document.getElementById('date-num').textContent = tempsReel.getDate();
            document.getElementById('date-mois').textContent = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCÉMBRE'][tempsReel.getMonth()];
            document.getElementById('date-annee').textContent = tempsReel.getFullYear();
            gererCycleJourNuit(h, m);
        }
        function executerMeteo() {
            let uM = 'https://open-meteo.com'
                + '?latitude=50.20&longitude=5.31'
                + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,uv_index'
                + '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset'
                + '&timezone=Europe%2FBerlin';
            fetch(uM).then(res => res.json()).then(data => {
                let cur = data.current;
                document.getElementById('courant-temp').textContent = Math.round(cur.temperature_2m) + "°C";
                document.getElementById('courant-ressenti').textContent = Math.round(cur.apparent_temperature) + "°C";
                document.getElementById('courant-humidite').textContent = cur.relative_humidity_2m + "%";
                vitesseVentActuelle = Math.round(cur.wind_speed_10m);
                document.getElementById('courant-vent').textContent = vitesseVentActuelle + " km/h";
                let uvVal = Math.round(cur.uv_index || 0);
                let uvText = "Bas"; if(uvVal >= 3 && uvVal <= 5) uvText = "Modéré"; if(uvVal >= 6) uvText = "Élevé";
                document.getElementById('courant-uv').textContent = uvVal + " / " + uvText;
                document.getElementById('sat-lever').textContent = data.daily.sunrise.substring(11, 16);
                document.getElementById('sat-coucher').textContent = data.daily.sunset.substring(11, 16);
                let code = cur.weather_code;
                let desc = "Éclaircies"; if(code === 0) desc = "Ensoleillé"; if(code > 0 && code <= 3) desc = "Éclaircies"; if(code >= 51 && code <= 67) desc = "Pluie Fine"; if(code >= 80) desc = "Orageux";
                document.getElementById('courant-desc').textContent = desc; weatherDescriptionGlobal = desc;
                gererEffetsMeteoEtParticules(desc.toLowerCase());
                var bas = document.getElementById('zone-7-jours'); bas.innerHTML = "";
                const noms = ['DIM.', 'LUN.', 'MAR.', 'MER.', 'JEU.', 'VEN.', 'SAM.']; const mois = ['JANV.', 'FÉVR.', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUIL.', 'AOÛT', 'SEPT.', 'OCT.', 'NOV.', 'DÉC.'];
                var dRef = new Date();
                for(let index = 0; index < 7; index++) {
                    var dObj = new Date(); dObj.setDate(dRef.getDate() + index);
                    injecterCartePrevisionHTML(bas, index, noms[dObj.getDay()], dObj.getDate(), mois[dObj.getMonth()], Math.round(data.daily.temperature_2m_max[index]), Math.round(data.daily.temperature_2m_min[index]), data.daily.weather_code[index]);
                }
            }).catch(() => {
                document.getElementById('courant-temp').textContent = "14°C"; document.getElementById('courant-ressenti').textContent = "13°C"; document.getElementById('courant-humidite').textContent = "85%"; document.getElementById('courant-vent').textContent = "5 km/h";
                document.getElementById('sat-lever').textContent = "06:48"; document.getElementById('sat-coucher').textContent = "20:26"; document.getElementById('courant-desc').textContent = "Éclaircies";
                var bas = document.getElementById('zone-7-jours'); bas.innerHTML = "";
                const noms = ['DIM.', 'LUN.', 'MAR.', 'MER.', 'JEU.', 'VEN.', 'SAM.']; const mois = ['JANV.', 'FÉVR.', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUIL.', 'AOÛT', 'SEPT.', 'OCT.', 'NOV.', 'DÉC.'];
                var dRef = new Date();
                let codesParDefaut = Array(0, 1, 2, 3, 51, 61, 80);
                for(let index = 0; index < 7; index++) {
                    var dObj = new Date(); dObj.setDate(dRef.getDate() + index);
                    injecterCartePrevisionHTML(bas, index, noms[dObj.getDay()], dObj.getDate(), mois[dObj.getMonth()], 24 - index, 14 - index, codesParDefaut[index]);
                }
            });
        }
        function injecterCartePrevisionHTML(conteneur, index, jourNom, jourNum, moisNom, maxT, minT, wCode) {
            let pType = "nuageux"; if(wCode === 0) pType = "ensoleillé"; else if(wCode > 0 && wCode <= 3) pType = "éclaircies"; else if(wCode >= 51 && wCode <= 67) pType = "pluie"; else if(wCode >= 80) pType = "orageux";
            let pictoHTML = ""; if (pType === "ensoleillé") pictoHTML = `<svg viewBox="0 0 24 24" style="width:2.5vw; height:2.5vw; display:block; margin:0 auto;"><circle cx="12" cy="12" r="5" fill="#ffa726"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="#ffa726" stroke-width="2" stroke-linecap="round"/></svg>`;
            else pictoHTML = `<svg viewBox="0 0 24 24" style="width:2.5vw; height:2.5vw; display:block; margin:0 auto;"><path d="M6 19c0 .55.45 1 1 1h12c1.66 0 3-1.34 3-3 0-1.42-.97-2.6-2.3-2.92C19.34 11.51 17.11 9 14.5 9c-2.07 0-3.9 1.59-4.38 3.65C9.44 12.24 8.76 12 8 12c-2.21 0-4 1.79-4 4 0 .34.05.67.14 1 .23.82.95 1.47 1.86 1.84c.14.06.31.11.48.14.17.03.34.02.52.02z" fill="#90a4ae"/></svg>`;
            var box = document.createElement('div'); box.className = "carte-prev-unique"; box.innerHTML = `<div style="font-weight:bold; font-size:1.1vw; color:#fff; margin-bottom:2px; width:100%; text-align:center;">${index===0?"AUJ.":jourNom}</div><div style="font-size:0.75vw; color:#aaa; font-weight:bold; margin-bottom:4px; width:100%; text-align:center;">${jourNum} ${moisNom}</div><div style="width:3.2vw; height:3.2vw; display:flex; align-items:center; justify-content:center; overflow:visible; margin:0.3vh 0; position:relative;">${pictoHTML}</div><div style="font-size:2vw; font-weight:bold; color:#fff; margin-top:2px; width:100%; text-align:center;">${maxT}°</div><div style="color:#49a6e9; font-weight:bold; font-size:1.4vw; width:100%; text-align:center;">${minT}°</div>`; conteneur.appendChild(box);
        }
        function gererEffetsMeteoEtParticules(desc) {
            var avant = document.getElementById('front-particles'); var nuage = document.getElementById('cloud-layer'); avant.innerHTML = "";
            if (desc.includes("nuageux") || desc.includes("éclaircies") || desc.includes("nuage") || desc.includes("averse")) { nuage.style.opacity = "0.55"; } else { nuage.style.opacity = "0"; }
            let masqueCiel = document.querySelector('.masque-ciel-strict'); if (masqueCiel && nuage && !masqueCiel.contains(nuage)) { masqueCiel.appendChild(nuage); }
            if (nuage.style.opacity > 0) nuage.className = "anim-clouds";
            if (desc.includes("pluie") || desc.includes("averse")) {
                for (let i = 0; i < 35; i++) {
                    let g = document.createElement('div'); g.className = "goutte-particule"; g.style.left = (Math.random() * 100) + "vw"; g.style.setProperty('--wind-x', (Math.random() * 30 - 15) + "vw"); g.style.animationDuration = (Math.random() * 0.4 + 0.6) + "s"; g.style.animationDelay = (Math.random() * 2) + "s"; avant.appendChild(g);
                }
            }
        }
        function gererCycleJourNuit(h, m) {
            var calque = document.getElementById('sky-gradient'); var decor = document.getElementById('school-view-bg'); var moon = document.getElementById('lune-vrai-ciel'); var desc = weatherDescriptionGlobal.toLowerCase(); var totalMin = (h * 60) + m;
            var dateAujourdhui = new Date(); var mo = dateAujourdhui.getMonth() + 1; var jour = dateAujourdhui.getDate();
            if (mo >= 3 && mo <= 5) currentSaison = "PRINTEMPS"; else if (mo >= 6 && mo <= 8) currentSaison = "ÉTÉ"; else if (mo === 9) { if (jour < 22) currentSaison = "ÉTÉ"; else currentSaison = "AUTOMNE"; } else if (mo >= 10 && mo <= 11) currentSaison = "AUTOMNE"; else currentSaison = "HIVER";
            document.getElementById('sat-saison').textContent = currentSaison;
            let filtreSaisonCSS = ""; let tapisFeuilles = document.getElementById('tapis-feuilles-automne');
            if (currentSaison === "AUTOMNE") { filtreSaisonCSS = "brightness(0.34) contrast(1.15) hue-rotate(35deg) saturate(1.2)"; if (tapisFeuilles) tapisFeuilles.style.opacity = "1"; }
            else if (currentSaison === "HIVER") { filtreSaisonCSS = "brightness(1.45) contrast(0.85) grayscale(0.3)"; if (tapisFeuilles) tapisFeuilles.style.opacity = "0"; }
            else { if (tapisFeuilles) tapisFeuilles.style.opacity = "0"; }
            
            if (totalMin >= 360 && totalMin < 430) { calque.style.background = "linear-gradient(to bottom, #ff7e5f, #feb47b)"; decor.style.setProperty('filter', filtreSaisonCSS ? filtreSaisonCSS : 'none', 'important'); if(moon) moon.style.display = "none"; }
            else if (totalMin >= 430 && totalMin < 1160) { 
                if (desc.includes("ensoleillé")) { calque.style.background = "linear-gradient(to bottom, #2b5c8f, #4a90e2)"; } 
                else { calque.style.background = "linear-gradient(to bottom, #3a4454, #5a697f)"; } 
                decor.style.setProperty('filter', filtreSaisonCSS ? filtreSaisonCSS : 'none', 'important'); if(moon) moon.style.display = "none"; 
            }
            else if (totalMin >= 1160 && totalMin < 1220) { calque.style.background = "linear-gradient(to bottom, #1a0b2e, #943126, #f39c12)"; decor.style.setProperty('filter', `brightness(0.9) saturate(1.1) ${filtreSaisonCSS}`, 'important'); if(moon) moon.style.display = "block"; }
            else { if (desc.includes("nuageux") || desc.includes("averse")) { calque.style.background = "linear-gradient(to bottom, #050814, #121829)"; } else { calque.style.background = "linear-gradient(to bottom, #01030a, #030714)"; } decor.style.setProperty('filter', `brightness(0.34) contrast(1.15) ${filtreSaisonCSS}`, 'important'); if(moon) moon.style.display = "block"; }
        }
        function calculPhaseLune() {
            var maintenant = new Date(); var nouvelleLuneRef = Date.UTC(2026, 7, 12, 17, 35, 0); var msEcoules = maintenant.getTime() - nouvelleLuneRef; var daysSinceNew = (msEcoules / (1000 * 60 * 60 * 24)) % 29.530588853; if (daysSinceNew < 0) daysSinceNew += 29.530588853;
            document.getElementById('lune-age').textContent = daysSinceNew.toFixed(1);
            let pct = Math.round((1 + Math.cos((daysSinceNew * Math.PI * 2) / 29.530588853)) * 50); document.getElementById('lune-ecl').textContent = pct;
            let pPhoto = document.getElementById('lune-vrai-photo'); if (pPhoto) { pPhoto.style.setProperty('background-image', "url('https://wikimedia.org')", 'important'); pPhoto.style.backgroundSize = 'cover'; pPhoto.style.backgroundPosition = 'center'; }
            let cCiel = document.getElementById('lune-vrai-ciel'); if (cCiel) { cCiel.style.backgroundImage = "url('https://wikimedia.org')"; cCiel.style.backgroundSize = 'cover'; cCiel.style.backgroundPosition = 'center'; }
            let sW = document.getElementById('lune-ombre-widget'); if (sW) { sW.style.setProperty('background', '#05080c', 'important'); }
            let sC = document.getElementById('lune-cache-vrai-ciel'); if (sC) { sC.style.setProperty('background', '#05080c', 'important'); }
            let appliquerVraieOmbreCurvee = (element) => { if (!element) return; element.style.left = "0%"; element.style.width = "100%"; if (daysSinceNew < 14.765) { let doublePct = Math.max(0, 100 - (pct * 2)); element.style.setProperty('clip-path', `ellipse(${doublePct}% 100% at 100% 50%)`, 'important'); } else { let doublePct = Math.max(0, 100 - (pct * 2)); element.style.setProperty('clip-path', `ellipse(${doublePct}% 100% at 0% 50%)`, 'important'); } };
            appliquerVraieOmbreCurvee(sW); appliquerVraieOmbreCurvee(sC);
            let nom = "Nouvelle lune"; if(daysSinceNew >= 1.5 && daysSinceNew < 6.5) nom = "Premier croissant"; else if(daysSinceNew >= 6.5 && daysSinceNew < 8.5) nom = "Premier quartier"; else if(daysSinceNew >= 8.5 && daysSinceNew < 13.5) nom = "Gibbeuse croissante"; else if(daysSinceNew >= 13.5 && daysSinceNew < 15.5) nom = "Pleine lune"; else if(daysSinceNew >= 15.5 && daysSinceNew < 22.0) nom = "Gibbeuse décroissante"; else if(daysSinceNew >= 22.0 && daysSinceNew < 24.0) nom = "Dernier quartier"; else if(daysSinceNew >= 24.0 && daysSinceNew < 28.0) nom = "Dernier croissant"; document.getElementById('lune-phase-nom').textContent = nom;
        }
        setInterval(actualiserHorloge, 1000); actualiserHorloge(); setTimeout(calculPhaseLune, 500); executerMeteo(); setInterval(executerMeteo, 900000);
