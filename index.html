<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ecran Master Connected - Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        
        /* CALQUES DU DECOR PERMANENT ET ATMOSPHERIQUE */
        #sky-gradient { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -4; transition: background 8s ease-in-out; pointer-events: none; }
        
        .lune-dans-le-ciel {
            position: fixed; top: 11vh; right: 20vw; width: 4.5vw; height: 4.4vw; border-radius: 50%;
            background-image: url('https://wikimedia.org') !important;
            background-size: cover; background-position: center; border: 1.5px solid rgba(255,255,255,0.4) !important;
            box-shadow: 0 0 15px rgba(255,255,255,0.35); filter: grayscale(1) brightness(1.2);
            z-index: -3; display: none; overflow: hidden; transition: opacity 8s ease-in-out;
        }
        .cache-lune-ciel { position: absolute; top: 0; width: 100%; height: 100%; background: rgba(5,8,12,0.88); }
        .decor-permanent { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-image: url('fond-final.png'); background-size: 100% 100%; background-position: center; z-index: -5; 
            transition: filter 8s ease-in-out;
        }
        
        .decor-permanent.effet-enneige::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15), rgba(255,255,255,0.42));
            mix-blend-mode: overlay; pointer-events: none;
        }
        
        #cloud-layer { position: fixed; top: 0; left: 0; width: 200vw; height: 40vh; background: url('https://wikimedia.org') repeat-x; background-size: contain; z-index: -2; opacity: 0; pointer-events: none; transition: opacity 4s; }
        #lightning-flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: rgba(255,255,255,0); pointer-events: none; }
        #back-precipitations { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        #front-particles { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 3; pointer-events: none; }

        .pos { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; }
        .boite-flip-haut {
            background: linear-gradient(to bottom, #11151c, #05070a) !important; border: 2px solid #28303d !important; border-radius: 8px !important;
            box-shadow: 0px 6px 12px rgba(0,0,0,0.5), inset 0px 0px 10px rgba(0,0,0,0.9) !important;
        }
        .flip-tuile-js { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.3vw; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; position: relative; }
        .flip-tuile-js::after { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 2px; background: #000000 !important; border-bottom: 1px solid rgba(255,255,255,0.18) !important; z-index: 5; }

        .charniere-gauche, .charniere-droite {
            position: absolute; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; z-index: 10;
            background: linear-gradient(to right, #444, #d1d1d1, #fff 40%, #d1d1d1 70%, #333) !important;
            border-radius: 3px !important; border: 1px solid #111 !important; box-shadow: 0 3px 5px rgba(0,0,0,0.4) !important;
        }
        .charniere-gauche { left: -6px !important; } .charniere-droite { right: -6px !important; }
        .charniere-gauche::after { content: ''; position: absolute; top: 4px; width: 4px; height: 14px; background: #161a22 !important; left: -3px; border: 1px solid #050505 !important; }
        .charniere-droite::after { content: ''; position: absolute; top: 4px; width: 4px; height: 14px; background: #161a22 !important; right: -3px; border: 1px solid #050505 !important; }
        .charniere-gauche::before, .charniere-droite::before { content: ''; position: absolute; left: 0; top: 10px; width: 100%; height: 4px; background: #111 !important; }
        /* RELIEF ET TRACE CHROMÉ DU CADRAN ANALOGIQUE DE L'HORLOGE */
        .montre-retro-cercle { position: absolute; right: 2.2vw; top: 1vh; width: 15.6vw; height: 15.6vw; background: #000000 !important; border: 2px solid #1d2633 !important; border-radius: 50%; box-shadow: 0px 4px 12px rgba(0,0,0,0.5); z-index: 10; }
        .graduation { position: absolute; width: 2px; height: 8px; background: rgba(255,255,255,0.4); left: 50%; top: 2px; margin-left: -1px; transform-origin: 50% 7.6vw; z-index: 11; }
        .graduation.principale { width: 3px; height: 12px; background: #ffffff !important; top: 2px; }
        .chiffre-container-js { position: absolute; width: 2vw; height: 2vw; left: 50%; top: 12px; margin-left: -1vw; transform-origin: 50% 6.6vw; display: flex; align-items: center; justify-content: center; z-index: 12; }
        .chiffre-cadran-fixe { font-size: 0.95vw; font-weight: bold; color: #ffffff !important; font-family: 'Arial Black', sans-serif; }

        .aiguille { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 4px; z-index: 13; }
        .heure { width: 5px; height: 3.2vw; background-color: #fff; } .minute { width: 4px; height: 4.9vw; background-color: #8ad400; }
        .pivot { position: absolute; width: 12px; height: 12px; background: #a2f200; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 15; box-shadow: 0 0 6px rgba(162,242,0,0.8); }

        .boite-digitale-bas { position: absolute; right: 2vw; top: 35.5vh; width: 17vw; height: 8vh; background: #05070a !important; border: none !important; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8) !important; }
        .heure-digitale-js { font-size: 2.7vw; font-weight: 900; color: #ffffff !important; letter-spacing: 1px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        .heure-digitale-js::after { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 2px; background: #000000; border-bottom: 1px solid rgba(255,255,255,0.15); z-index: 5; }
        /* PURIFICATION ESTHÉTIQUE COMPLETE DES CADRANS DE INTERFACE INTERNE */
        .cadran-relief-bleu { background: #0d131a !important; border: 2px solid #212c3a !important; border-radius: 12px !important; box-shadow: 0 8px 16px rgba(0,0,0,0.7), inset 0 0 12px rgba(0,0,0,0.8) !important; opacity: 1 !important; z-index: 10; transition: border-color 8s ease-in-out, box-shadow 8s ease-in-out; }
        .cadran-relief-noir-bloc { background: #05080c !important; border: 2px solid #162029 !important; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.6); z-index: 10; transition: border-color 8s ease-in-out, box-shadow 8s ease-in-out; }
        
        /* CADRES BLANCS ASSIGNES EXCLUSIVEMENT AUX MODULES DE DROITE */
        .cadran-relief-bleu.nuit-active-widget { border-color: rgba(255, 255, 255, 0.72) !important; box-shadow: 0 0 14px rgba(255,255,255,0.22), inset 0 0 12px rgba(0,0,0,0.8) !important; }
        .cadran-relief-noir-bloc.nuit-active-widget { border-color: rgba(255, 255, 255, 0.65) !important; box-shadow: 0 0 12px rgba(255,255,255,0.18), 0 6px 12px rgba(0,0,0,0.6) !important; }

        .carte-prev-unique { width: 10.4vw; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 1.5vh 0; background: #0d131a !important; border: 2px solid #212c3a !important; border-radius: 12px !important; }
        .soleil-realiste-css { width: 3.2vw; height: 3.2vw; background: radial-gradient(circle, #fff 15%, #ffea00 55%, #ff7700 100%); border-radius: 50%; box-shadow: 0 0 18px rgba(255,210,0,0.75), 0 0 35px rgba(255,100,0,0.4); }
        .lune-doree-image { position: relative; width: 3.4vw; height: 3.4vw; border-radius: 50%; background-image: url('https://wikimedia.org') !important; background-size: cover; background-position: center; border: 1.5px solid rgba(255,255,255,0.5) !important; box-shadow: 0 0 14px rgba(255,255,255,0.4); filter: grayscale(1) brightness(1.2); display: block; overflow: hidden; }
        .cache-ombre-lunaire { position: absolute; top: 0; width: 100%; height: 100%; background: rgba(5,8,12,0.88); transition: left 0.5s, width 0.5s; }
        /* DESSIN VECTORIEL DU ARBRE FRUITIER (POMMIER ILLUSTRÉ ET PLUS GRAND SANS ALLURE ENFANTINE) */
        .case-illustration-pommier { width: 4.8vw; height: 4.8vw; position: relative; display: flex; align-items: center; justify-content: center; background: transparent; overflow: visible; }
        .trunk-hd { position: absolute; width: 6px; background: #5d4037; bottom: 0.2vw; height: 2vw; border-radius: 3px; left: 50%; transform: translateX(-50%); }
        .trunk-hd::before { content:''; position: absolute; width: 10px; height: 2px; background: #5d4037; bottom: 4px; left: -8px; transform: rotate(-25deg); }
        .trunk-hd::after { content:''; position: absolute; width: 10px; height: 2px; background: #5d4037; bottom: 8px; right: -8px; transform: rotate(25deg); }
        
        .canopy-hd { position: absolute; border-radius: 50%; background: #1b5e20; width: 4vw; height: 3.6vw; bottom: 1.6vw; left: 50%; transform: translateX(-50%); box-shadow: inset -4px -4px 10px rgba(0,0,0,0.25), 0 3px 6px rgba(0,0,0,0.3); opacity: 0; transition: all 1s ease; }
        .pommier-pomme { position: absolute; width: 6px; height: 6px; background: #ea2c2c; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.4); opacity: 0; transition: opacity 1s; }
        .pommier-fleur { position: absolute; width: 6px; height: 6px; background: #ffc0cb; border-radius: 50%; border: 1px solid #fff; opacity: 0; transition: opacity 1s; }
        .pommier-neige { position: absolute; height: 4px; background: #ffffff; border-radius: 2px; opacity: 0; transition: opacity 1s; }

        .picto-pro-meteo { position: relative; width: 4.8vw; height: 4.8vw; display: flex; align-items: center; justify-content: center; }
        .picto-pro-meteo .soleil-centre { width: 2.2vw; height: 2.2vw; background: #ffea00; border-radius: 50%; box-shadow: 0 0 15px #ffdf00; }
        .picto-pro-meteo .nuage-face { position: absolute; width: 3.2vw; height: 1.6vw; background: #ffffff; border-radius: 20px; bottom: 0.8vw; left: 0.8vw; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
        .picto-pro-meteo .nuage-face::before { content:''; position: absolute; width: 1.6vw; height: 1.6vw; background: #ffffff; border-radius: 50%; top: -0.8vw; left: 0.5vw; }
        .picto-pro-meteo .nuage-face::after { content:''; position: absolute; width: 1.2vw; height: 1.2vw; background: #ffffff; border-radius: 50%; top: -0.5vw; right: 0.5vw; }
        .picto-pro-mini { scale: 0.65; display: inline-block; vertical-align: middle; }
        .feuille-peuplier-svg { position: absolute; width: 13px; height: 13px; background: var(--leaf-color); border-radius: 2px 75% 60% 75%; transform-origin: center; animation: flowWind linear infinite; }
        .goutte-particule { position: absolute; background: #ffffff; width: 2px; height: 22px; animation: flowChute linear infinite; }
        .flocon-particule { position: absolute; background: #ffffff; border-radius: 50%; animation: flowChute linear infinite; }
        
        @keyframes flowChute { 0% { transform: translateY(-5vh) translateX(0); } 100% { transform: translateY(105vh) translateX(var(--wind-x)); } }
        @keyframes flowWind { 0% { transform: translate(-5vw, var(--start-y)) rotate(0deg); } 100% { transform: translate(105vw, var(--end-y)) rotate(1080deg); } }
        @keyframes cloudMove { 0% { transform: translateX(0); } 100% { transform: translateX(-100vw); } }
        .anim-clouds { animation: cloudMove linear infinite var(--cloud-speed); }
    </style>
</head>
<body>
    <div id="sky-gradient"></div>
    <div class="lune-dans-le-ciel" id="lune-vrai-ciel"><div class="cache-lune-ciel" id="lune-ombre-ciel"></div></div>
    <div id="school-view-bg" class="decor-permanent"></div>
    <div id="cloud-layer"></div> <div id="lightning-flash"></div> <div id="back-precipitations"></div> <div id="front-particles"></div>
    <!-- CALENDRIER HAUT -->
    <div class="pos boite-flip-haut" style="left: 17.5vw; top: 2.5vh; width: 22.3vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-jour">--</div><div class="charniere-droite"></div></div>
    <div class="pos boite-flip-haut" style="left: 40.8vw; top: 2.5vh; width: 9.6vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-num">--</div><div class="charniere-droite"></div></div>
    <div class="pos boite-flip-haut" style="left: 51.5vw; top: 2.5vh; width: 13.5vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-mois">--</div><div class="charniere-droite"></div></div>
    <div class="pos boite-flip-haut" style="left: 66.2vw; top: 2.5vh; width: 11.5vw; height: 10vh;"><div class="charniere-gauche"></div><div class="flip-tuile-js" id="date-annee">----</div><div class="charniere-droite"></div></div>

    <!-- HORLOGE ANALOGIQUE COMPLÈTE -->
    <div class="montre-retro-cercle" id="cadran-montre">
        <div class="pivot"></div> <div class="aiguille heure" id="needle-hour"></div> <div class="aiguille minute" id="needle-minute"></div>
    </div>
    <div class="boite-digitale-bas"><div class="charniere-gauche"></div><div class="heure-digitale-js" id="horloge-texte">--:--:--</div><div class="charniere-droite"></div></div>

    <!-- METEO DE GAUCHE DES PEUPLIERS -->
    <div class="cadran-relief-bleu" id="cadran-meteo-g" style="position: absolute; left: 1.5vw; top: 25vh; width: 28.5vw; height: 35vh; padding: 1.3vw; color: #ffffff;">
        <div style="font-size: 1.1vw; color: #ffffff; font-weight: bold; margin-bottom: 2px; text-align: left; font-family:'Arial';">Marloie (Marche-en-Famenne)</div>
        <div style="font-size: 0.75vw; color: #aaaaaa; text-transform: uppercase; margin-bottom: 1.2vh; letter-spacing: 1px;">MÉTÉO ACTUELLE</div>
        <div style="display: flex; align-items: center; gap: 2vw; margin-bottom: 2.5vh;">
            <div class="picto-pro-meteo"><div class="soleil-centre"></div><div class="nuage-face"></div></div>
            <div style="text-align: left;">
                <div style="font-size: 4.2vw; font-weight: bold; line-height: 1;" id="courant-temp">18°C</div>
                <div style="font-size: 1.2vw; color: #ffffff; margin-top: 4px; font-weight: bold; font-family:'Arial';" id="courant-desc">Éclaircies</div>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 1.5vh; text-align: center; font-family:'Arial'; font-weight:bold;">
            <div style="flex: 1;"><div style="font-size: 0.65vw; color: #aaaaaa; text-transform: uppercase;">RESSENTIE</div><div style="font-size: 1.15vw; margin-top: 4px; color: #ffffff;" id="courant-ressenti">18°C</div></div>
            <div style="flex: 1; border-left: 1px solid rgba(255,255,255,0.1);"><div style="font-size: 0.65vw; color: #aaaaaa; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 3px;"><span style="color: #49a6e9; font-size: 0.9vw;">💧</span> HUMIDITÉ</div><div style="font-size: 1.15vw; margin-top: 4px; color: #ffffff;" id="courant-humidite">72%</div></div>
            <div style="flex: 1; border-left: 1px solid rgba(255,255,255,0.1);"><div style="font-size: 0.65vw; color: #aaaaaa; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 3px;"><span style="color: #ffffff; font-size: 0.9vw;">💨</span> VENT</div><div style="font-size: 1.15vw; margin-top: 4px; color: #ffffff;" id="courant-vent">12 km/h</div></div>
            <div style="flex: 1; border-left: 1px solid rgba(255,255,255,0.1);"><div style="font-size: 0.65vw; color: #aaaaaa; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 3px;"><span style="color: #e9a949; font-size: 0.9vw;">☀️</span> UV</div><div style="font-size: 1.1vw; margin-top: 4px; color: #ffffff;" id="courant-uv">1 / Bas</div></div>
        </div>
    </div>

    <!-- MODULE CENTRAL DROIT SOLEIL REEL -->
    <div class="cadran-relief-noir-bloc" id="cadran-saison-d" style="position: absolute; right: 2vw; top: 45.5vh; width: 17vw; height: 28vh; padding: 1vw 1.2vw; display: flex; flex-direction: column; justify-content: space-between;">
        <div style="display: flex; justify-content: space-between; align-items: center; height: 45%; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 0.5vh; width: 100%;">
            <div style="text-align: left;">
                <div style="font-size: 1.1vw; color: #8ad400; font-weight: bold; letter-spacing: 0.5px;">SAISON</div>
                <div style="font-size: 2vw; font-weight: bold; color: #ffffff; margin-top: 0.2vh;" id="sat-saison">--</div>
            </div>
            <div class="case-illustration-pommier" id="box-blueprint-dynamique"></div>
        </div>
        <div style="display: flex; flex-direction: column; justify-content: space-between; height: 50%; width: 100%; padding-top: 0.5vh;">
            <div style="font-size: 1.1vw; color: #8ad400; font-weight: bold; text-align: left; letter-spacing: 0.5px;">SOLEIL</div>
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="soleil-realiste-css"></div>
                <div style="display: flex; gap: 1vw; text-align: left; align-items: center; font-family:'Arial'; font-weight:bold;">
                    <div><div style="font-size: 1.1vw; font-weight: bold; color: #fff;" id="sat-lever">06:44</div><div style="font-size: 0.65vw; color: #aaa;">Lever</div></div>
                    <div style="width: 1px; background: rgba(255,255,255,0.4); height: 2.5vh;"></div>
                    <div><div style="font-size: 1.1vw; font-weight: bold; color: #fff;" id="sat-coucher">20:28</div><div style="font-size: 0.65vw; color: #aaa;">Coucher</div></div>
                </div>
            </div>
        </div>
    </div>
    <!-- MODULE LUNE REMODELÉ -->
    <div class="cadran-relief-noir-bloc" id="cadran-lune-d" style="position: absolute; right: 2vw; top: 75vh; width: 17vw; height: 14.5vh; padding: 1vw 1.2vw; display: flex; justify-content: space-between; align-items: center; font-family:'Arial'; font-weight:bold;">
        <div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; text-align: left;">
            <div style="font-size: 1.1vw; color: #8ad400; font-weight: bold; letter-spacing: 0.5px; font-family:'Arial Black';">LUNE</div>
            <div style="font-size: 0.78vw; line-height: 1.35; color: #ffffff; margin-top: 0.3vh;">
                <strong style="font-size: 0.95vw; color: #fff; display: block; margin-bottom: 2px;" id="lune-phase-nom">Calcul...</strong>
                Âge : <span id="lune-age">--</span> j<br>Éclairement : <span id="lune-ecl">--</span>%
            </div>
        </div>
        <div class="lune-doree-image" id="lune-vrai-photo"><div class="cache-ombre-lunaire" id="lune-ombre-widget"></div></div>
    </div>

    <!-- PREVISIONS D'EN BAS SÉCURISÉES -->
    <div style="position: absolute; left: 1.5vw; bottom: 8vh; width: 77.5vw; height: 27.5vh; display: flex; justify-content: space-between;" id="zone-7-jours"></div>

    <script>
        var vitesseVentActuelle = 12; var currentSaison = "ÉTÉ"; var isNightTime = false; var orageInterval = null;

        /* INJECTION MECANIQUE DU CADRAN DE L'HORLOGE RETRO */
        var mC = document.getElementById('cadran-montre');
        for (var i = 1; i <= 12; i++) {
            var box = document.createElement('div'); box.className = 'chiffre-container-js'; box.style.transform = 'rotate(' + (i * 30) + 'deg)';
            var n = document.createElement('div'); n.className = 'chiffre-cadran-fixe'; n.textContent = i; n.style.transform = 'rotate(' + (-i * 30) + 'deg)';
            box.appendChild(n); mC.appendChild(box);
        }
        for (var j = 0; j < 60; j++) {
            var g = document.createElement('div'); g.className = (j % 5 === 0) ? 'graduation principale' : 'graduation'; g.style.transform = 'rotate(' + (j * 6) + 'deg)'; mC.appendChild(g);
        }
        function actualiserHorloge() {
            var tempsReel = new Date(); var h = tempsReel.getHours(); var m = tempsReel.getMinutes(); var s = tempsReel.getSeconds();
            document.getElementById('horloge-texte').textContent = h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
            document.getElementById('needle-hour').style.transform = 'translateX(-50%) rotate(' + ((h % 12) * 30 + m * 0.5) + 'deg)';
            document.getElementById('needle-minute').style.transform = 'translateX(-50%) rotate(' + (m * 6) + 'deg)';
            document.getElementById('date-jour').textContent = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'][tempsReel.getDay()];
            document.getElementById('date-num').textContent = tempsReel.getDate();
            document.getElementById('date-mois').textContent = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCÉMBRE'][tempsReel.getMonth()];
            document.getElementById('date-annee').textContent = tempsReel.getFullYear();
            
            /* DÉTERMINATION EXACTE ET CONFIGURATION DES SEUILS SAISONNIERS ASTRONOMIQUES REELS */
            var mNum = tempsReel.getMonth() + 1; var dNum = tempsReel.getDate();
            if ((mNum == 3 && dNum >= 20) || mNum == 4 || mNum == 5 || (mNum == 6 && dNum < 21)) currentSaison = "PRINTEMPS";
            else if ((mNum == 6 && dNum >= 21) || mNum == 7 || mNum == 8 || (mNum == 9 && dNum < 23)) currentSaison = "ÉTÉ";
            else if ((mNum == 9 && dNum >= 23) || mNum == 10 || mNum == 11 || (mNum == 12 && dNum < 21)) currentSaison = "AUTOMNE";
            else currentSaison = "HIVER";
            
            document.getElementById('sat-saison').textContent = currentSaison; actualiserVegetationBlueprint(); gererCycleJourNuit();
        }

        function executerMeteo() {
            fetch('https://wttr.in').then(res => res.json()).then(data => {
                var current = data.current_condition;
                document.getElementById('courant-temp').textContent = Math.round(current.temp_C) + "°C";
                document.getElementById('courant-ressenti').textContent = Math.round(current.FeelsLikeC) + "°C";
                document.getElementById('courant-humidite').textContent = current.humidity + "%";
                vitesseVentActuelle = Math.round(current.windspeedKmh);
                document.getElementById('courant-vent').textContent = vitesseVentActuelle + " km/h";
                document.getElementById('courant-uv').textContent = current.uvIndex + " / Max";
                document.getElementById('courant-desc').textContent = current.lang_fr ? current.lang_fr.value : "Éclaircies";
                gererEffetsMeteoEtParticules(current.weatherDesc.value.toLowerCase());
            }).catch(() => { gererEffetsMeteoEtParticules("cloudy"); });

            var bas = document.getElementById('zone-7-jours'); bas.innerHTML = "";
            const noms = ['DIM.', 'LUN.', 'MAR.', 'MER.', 'JEU.', 'VEN.', 'SAM.'];
            const mois = ['JANV.', 'FÉVR.', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUIL.', 'AOÛT', 'SEPT.', 'OCT.', 'NOV.', 'DÉC.'];
            var dRef = new Date();
            for(let index=0; index<7; index++) {
                var d = new Date(); d.setDate(dRef.getDate() + index);
                var box = document.createElement('div'); box.className = "carte-prev-unique";
                box.innerHTML = `<div style="font-weight:bold; font-family:'Arial Black'; font-size:1.1vw; color:#ffffff;">${index===0?"AUJ.":noms[d.getDay()]}</div><div style="font-size:0.75vw; color:#aaa; font-weight:bold;">${d.getDate()} ${mois[d.getMonth()]}</div><div class="picto-pro-meteo picto-pro-mini"><div class="soleil-centre"></div><div class="nuage-face"></div></div><div style="font-size:2vw; font-weight:bold; color:#ffffff;">22°</div><div style="color:#49a6e9; font-weight:bold; font-size:1.4vw;">13°</div>`;
                bas.appendChild(box);
            }
        }
        setInterval(actualiserHorloge, 1000);
        function gererEffetsMeteoEtParticules(desc) {
            var avant = document.getElementById('front-particles'); var arriere = document.getElementById('back-precipitations');
            var nuage = document.getElementById('cloud-layer'); avant.innerHTML = ""; arriere.innerHTML = ""; clearInterval(orageInterval);
            var windX = (vitesseVentActuelle * 2.5) + "vw";
            nuage.style.opacity = desc.includes("cloud") || desc.includes("rain") || currentSaison === "HIVER" ? "0.65" : "0";
            if(nuage.style.opacity > 0) nuage.className = "anim-clouds";
            if(desc.includes("rain")) {
                for(let i=0; i<Math.min(100, 30 + vitesseVentActuelle); i++) {
                    let g = document.createElement('div'); g.className = "goutte-particule"; g.style.left = Math.random() * 100 + "vw"; g.style.top = Math.random() * -20 + "vh";
                    g.style.setProperty('--wind-x', windX); g.style.animationDuration = (Math.random() * 0.3 + 0.4) + "s"; (i % 2 === 0 ? arriere : avant).appendChild(g);
                }
            }
            if(currentSaison === "HIVER") {
                for(let i=0; i<Math.min(80, 25 + vitesseVentActuelle); i++) {
                    let f = document.createElement('div'); f.className = "flocon-particule"; f.style.left = Math.random() * 100 + "vw"; f.style.top = Math.random() * -10 + "vh";
                    let size = Math.random() * 5 + 2; f.style.width = size + "px"; f.style.height = size + "px"; f.style.setProperty('--wind-x', windX); f.style.animationDuration = (Math.random() * 2 + 2) + "s"; (i % 2 === 0 ? arriere : avant).appendChild(f);
                }
            }
            if(currentSaison !== "HIVER") {
                let leafCount = Math.min(10, Math.floor(vitesseVentActuelle * 0.3) + (currentSaison === "AUTOMNE" ? 15 : 2));
                let listColors = currentSaison === "AUTOMNE" ? ["#c45d07", "#b82a06", "#d4a310"] : ["#48a316", "#5cb81b"];
                for(let i=0; i<leafCount; i++) {
                    let l = document.createElement('div'); l.className = "feuille-peuplier-svg"; l.style.setProperty('--leaf-color', listColors[Math.floor(Math.random() * listColors.length)]);
                    l.style.left = "-2vw"; l.style.setProperty('--start-y', (Math.random() * 85) + "vh"); l.style.setProperty('--end-y', (Math.random() * 95) + "vh"); l.style.animationDuration = Math.max(1.8, 6.5 - (vitesseVentActuelle * 0.08)) + "s"; l.style.animationDelay = (Math.random() * 5) + "s"; avant.appendChild(l);
                }
            }
        }

        function gererCycleJourNuit() {
            var h = new Date().getHours(); var calque = document.getElementById('sky-gradient'); var decor = document.getElementById('school-view-bg'); var moon = document.getElementById('lune-vrai-ciel');
            var cS = document.getElementById('cadran-saison-d'); var cL = document.getElementById('cadran-lune-d');
            decor.classList.remove('effet-enneige'); if(currentSaison === "HIVER") decor.classList.add('effet-enneige');
            if(h >= 7 && h < 18) { 
                calque.style.background = "linear-gradient(to bottom, rgba(3,15,40,0), transparent)"; decor.style.filter = currentSaison === "AUTOMNE" ? "sepia(0.35) saturate(1.4) contrast(1.05)" : (currentSaison === "ÉTÉ" ? "brightness(1.18) saturate(1.1)" : "none"); isNightTime = false; moon.style.display = "none";
                cS.classList.remove('nuit-active-widget'); cL.classList.remove('nuit-active-widget');
            } else if(h >= 18 && h < 21) { 
                calque.style.background = "linear-gradient(to bottom, rgba(237,105,32,0.38), rgba(5,15,30,0.2))"; decor.style.filter = "brightness(0.85) saturate(1.2)"; isNightTime = false; moon.style.display = "none";
                cS.classList.remove('nuit-active-widget'); cL.classList.remove('nuit-active-widget');
            } else { 
                calque.style.background = "linear-gradient(to bottom, rgba(2,5,15,0.95), rgba(1,2,5,0.98))"; decor.style.filter = "brightness(0.38) contrast(1.1)"; isNightTime = true; moon.style.display = "block";
                cS.classList.add('nuit-active-widget'); cL.classList.add('nuit-active-widget');
            }
        }

        function actualiserVegetationBlueprint() {
            var box = document.getElementById('box-blueprint-dynamique');
            let trunk = '<div class="trunk-hd"></div>';
            if(currentSaison === "PRINTEMPS") {
                box.innerHTML = trunk + '<div class="canopy-hd" style="opacity:1; background:#43a047;"></div><div class="pommier-fleur" style="bottom:2.6vw; left:1.2vw; opacity:1;"></div><div class="pommier-fleur" style="bottom:3.2vw; right:1.5vw; opacity:1;"></div><div class="pommier-fleur" style="bottom:2.2vw; right:2.2vw; opacity:1;"></div>';
            } else if(currentSaison === "ÉTÉ") {
                box.innerHTML = trunk + '<div class="canopy-hd" style="opacity:1; background:#2e7d32; width:4.1vw; height:3.7vw;"></div><div class="pommier-pomme" style="bottom:2.5vw; left:1.1vw; opacity:1;"></div><div class="pommier-pomme" style="bottom:3.1vw; right:1.4vw; opacity:1;"></div><div class="pommier-pomme" style="bottom:3.4vw; left:2.2vw; opacity:1;"></div><div class="pommier-pomme" style="bottom:2vw; right:2vw; opacity:1;"></div>';
            } else if(currentSaison === "AUTOMNE") {
                box.innerHTML = trunk + '<div class="canopy-hd" style="opacity:0.9; background:#ef6c00; border-radius:45% 55% 45% 55%;"></div><div class="pommier-pomme" style="bottom:0.4vw; left:1vw; opacity:1;"></div><div class="pommier-pomme" style="bottom:0.3vw; right:0.8vw; opacity:1;"></div>';
            } else {
                box.innerHTML = trunk + '<div class="pommier-neige" style="width:2.8vw; bottom:3.6vw; left:50%; transform:translateX(-50%); opacity:1; box-shadow:0 1px 3px #fff;"></div><div class="pommier-neige" style="width:1.2vw; bottom:2.5vw; left:1.3vw; opacity:1;"></div><div class="pommier-neige" style="width:1.2vw; bottom:2.9vw; right:1.3vw; opacity:1;"></div>';
            }
        }

        actualiserHorloge(); setTimeout(calculPhaseLune, 500); executerMeteo(); setInterval(executerMeteo, 900000);
    </script>
</body>
</html>
