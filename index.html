<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecran Dynamique - Les Peupliers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .fond-global {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('fond-final.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        header { position: relative; height: 16vh; z-index: 10; }

        /* STRUCTURE ET VISUEL DU CALENDRIER STYLE FLIP-FLAP MÉCANIQUE */
        .zone-flip-flap {
            position: absolute;
            top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 86px;
            background: transparent;
            overflow: hidden;
        }
        
        .flip-tuile-js {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0px 3px 4px rgba(0,0,0,0.9);
            position: relative;
        }

        /* LA LIGNE HORIZONTALE DE SÉPARATION MÉCANIQUE DU FLIP-FLAP */
        .flip-tuile-js::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 6;
        }

        /* REPOSITIONNEMENT CHIRURGICAL ET ROTATION DES AIGUILLES SUR VOTRE HORLOGE VIDE */
        .cadran-aiguilles {
            position: absolute;
            right: 22px;
            top: 18px;
            width: 195px;
            height: 195px;
            background: transparent;
            z-index: 10;
        }
        .aiguille {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }
        .heure { width: 5px; height: 50px; background-color: #fff; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .minute { width: 4px; height: 72px; background-color: #8ad400; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

        /* STYLE HORLOGE DIGITALE FLIP-FLAP */
        .zone-digitale-flip {
            position: absolute;
            right: 22px;
            top: 227px;
            width: 195px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
        }
        .zone-digitale-flip::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        main { display: flex; justify-content: space-between; height: 64vh; margin: 10px 0; position: relative; z-index: 10; }
        footer { height: 18vh; position: relative; z-index: 10; }

        .particule-feuille { position: absolute; width: 14px; height: 9px; background: #628c34; border-radius: 0 75% 0 75%; opacity: 0.65; animation: animationVent linear infinite; }
        @keyframes animationVent {
            0% { transform: translate(-40px, 0px) rotate(0deg); }
            100% { transform: translate(55vw, 180px) rotate(540deg); }
        }
    </style>
</head>
<body>

    <div id="fond-ecran-principal" class="fond-global"></div>

    <div id="zone-feuilles-dynamiques" style="position: fixed; top: 20vh; left: 28vw; width: 46vw; height: 55vh; pointer-events: none; z-index: 2; overflow: hidden;"></div>

    <header>
        <!-- PLACEMENT AU MILLIMÈTRE DES DONNÉES DANS VOS CASES FLIP-FLAP VIDES (DU HAUT) -->
        <div class="zone-flip-flap" style="left: 173px; width: 228px;"><div class="flip-tuile-js" id="date-jour">SAMEDI</div></div>
        <div class="zone-flip-flap" style="left: 412px; width: 95px;"><div class="flip-tuile-js" id="date-num">29</div></div>
        <div class="zone-flip-flap" style="left: 518px; width: 140px;"><div class="flip-tuile-js" id="date-mois">AOÛT</div></div>
        <div class="zone-flip-flap" style="left: 668px; width: 115px;"><div class="flip-tuile-js" id="date-annee">2026</div></div>

        <!-- CADRAN DE L'HORLOGE RONDE (CENTRE DES AIGUILLES ALIGNÉ) -->
        <div class="cadran-aiguilles">
            <div class="aiguille heure" id="needle-hour"></div>
            <div class="aiguille minute" id="needle-minute"></div>
        </div>
        
        <!-- INTÉGRATION DE L'HORLOGE DIGITALE FLIP-FLAP COMPACTE DANS VOTRE CADRAN NOIR BAS -->
        <div class="zone-digitale-flip" id="horloge-texte">13:15:00</div>
    </header>

    <main>
        <!-- TEXTE DE LA TEMPÉRATURE DU JOUR CENTRÉ DANS LE PANNEAU MÉTÉO DE GAUCHE -->
        <div style="position: absolute; left: 165px; top: 115px; width: 110px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: bold; color: #fff;" id="temp-meteo-courante">19°C</div>
    </main>

    <footer></footer>

    <script>
        function actualiserEcran() {
            var tempsReel = new Date();
            
            // Horloge numérique
            var h = tempsReel.getHours();
            var m = tempsReel.getMinutes();
            var s = tempsReel.getSeconds();
            document.getElementById('horloge-texte').textContent = h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0');
            
            // Rotation des aiguilles blanches et vertes
            var degHeure = (h % 12) * 30 + m * 0.5;
            var degMinute = m * 6;
            document.getElementById('needle-hour').style.transform = 'translateX(-50%) rotate(' + degHeure + 'deg)';
            document.getElementById('needle-minute').style.transform = 'translateX(-50%) rotate(' + degMinute + 'deg)';

            var listeJours = ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'];
            var listeMois = ['JANVIER', 'FÉVRIER', 'MARS', 'AVRIL', 'MAI', 'JUIN', 'JUILLET', 'AOÛT', 'SEPTEMBRE', 'OCTOBRE', 'NOVEMBRE', 'DÉCÉMBRE'];
            
            document.getElementById('date-jour').textContent = listeJours[tempsReel.getDay()];
            document.getElementById('date-num').textContent = tempsReel.getDate();
            document.getElementById('date-mois').textContent = listeMois[tempsReel.getMonth()];
            document.getElementById('date-annee').textContent = tempsReel.getFullYear();
        }
        
        setInterval(actualiserEcran, 1000);
        actualiserEcran();

        var conteneurFeuilles = document.getElementById('zone-feuilles-dynamiques');
        function lancerFeuille() {
            var feuille = document.createElement('div');
            feuille.classList.add('particule-feuille');
            feuille.style.top = (Math.random() * 90) + '%';
            feuille.style.left = '-20px';
            feuille.style.animationDuration = (Math.random() * 2.5 + 3.5) + 's';
            conteneurFeuilles.appendChild(feuille);
            setTimeout(function() { feuille.remove(); }, 6000);
        }
        setInterval(lancerFeuille, 1800);
    </script>
</body>
</html>
