    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background-color: #000; background-image:url('fond-final.png'); background-size:100vw 100vh; background-position:center; background-repeat:no-repeat; color: #fff; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
        #school-view-bg, .decor-permanent { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('fond-final.png') no-repeat center center !important; background-size: 100% 100% !important; z-index: 0 !important; transition: filter 8s ease-in-out; }
        #school-view-bg::after, .decor-permanent::after { content: ''; position: absolute; inset: 0; background: transparent; pointer-events: none; }
        #sky-gradient { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1 !important; mix-blend-mode: normal !important; opacity: .58; transition: background 8s ease-in-out, opacity 8s ease-in-out; pointer-events: none; }
        .lune-dans-le-ciel { position: fixed; top: 11vh; right: 20vw; width: 4.5vw; height: 4.4vw; border-radius: 50%; background-image: radial-gradient(circle at 35% 35%,#fff 0 12%,#d8dbe0 42%,#8f9399 100%) !important; background-size: cover; background-position: center; border: 1.5px solid rgba(255,255,255,0.4) !important; box-shadow: 0 0 15px rgba(255,255,255,0.35); filter: grayscale(1) brightness(1.2); z-index: -4; display: none; overflow: hidden; transition: opacity 8s ease-in-out; }
        .cache-lune-ciel { position: absolute; top: 0; width: 100%; height: 100%; background: rgba(5,8,12,0.92); }
        #cloud-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 5 !important; opacity: 0; pointer-events: none; transition: opacity 4s ease-in-out; overflow:hidden; }
        #cloud-layer::before,#cloud-layer::after{content:'';position:absolute;top:4vh;left:-30vw;width:160vw;height:28vh;background:radial-gradient(ellipse at 15% 55%,rgba(255,255,255,.48) 0 8%,transparent 20%),radial-gradient(ellipse at 35% 45%,rgba(255,255,255,.36) 0 10%,transparent 24%),radial-gradient(ellipse at 58% 55%,rgba(255,255,255,.42) 0 9%,transparent 22%),radial-gradient(ellipse at 80% 45%,rgba(255,255,255,.30) 0 8%,transparent 20%);filter:blur(12px);animation:cloudMove 70s linear infinite;}
        #cloud-layer::after{top:10vh;opacity:.45;animation-duration:105s;animation-direction:reverse;filter:blur(18px);}
        #lightning-flash { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 6 !important; pointer-events:none; overflow:hidden; }
        .lightning-bolt{position:absolute;top:3vh;left:var(--lx);width:var(--lw);height:var(--lh);filter:drop-shadow(0 0 7px rgba(220,245,255,.95));opacity:0;transform-origin:top center;}
        .lightning-bolt svg{width:100%;height:100%;overflow:visible;}
        .lightning-bolt path{fill:none;stroke:#f7fdff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;}
        .lightning-bolt .branch{stroke-width:1.25;opacity:.88;}
        .lightning-bolt.strike{animation:boltStrike .42s steps(3,end) forwards;}
        @keyframes boltStrike{0%,10%{opacity:0}12%{opacity:1}22%{opacity:.1}30%{opacity:1}43%{opacity:0}100%{opacity:0}}
        #back-precipitations { position: fixed; inset:0; width:100vw; height:100vh; z-index: 7 !important; pointer-events:none; }
        #front-particles { position: fixed; inset:0; width:100vw; height:100vh; z-index: 40 !important; pointer-events:none; overflow:hidden; }
        .pos { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; }
        .boite-flip-haut {
            background: linear-gradient(180deg,#111820 0%,#05080d 72%,#030507 100%) !important;
            border: 1.5px solid rgba(43,177,245,.92) !important;
            border-radius: 9px !important;
            box-shadow: 0 7px 18px rgba(0,0,0,.72), inset 0 0 11px rgba(0,0,0,.9), 0 0 7px rgba(22,164,230,.22) !important;
        }
        .boite-flip-haut .flip-tuile-js {

            font-size:2.08vw !important; letter-spacing:.65px !important;
            padding-bottom:0vh !important; height:6.2vh !important; line-height:6.2vh !important;
            text-shadow:0 2px 2px rgba(0,0,0,.95),0 0 1px rgba(255,255,255,.35);
            display: flex !important; align-items: center !important; justify-content: center !important;
        }
        #date-jour::after,#date-num::after,#date-mois::after,#date-annee::after { display:none !important; }
        .boite-flip-haut::after { height:1.5vh !important; background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.48)) !important; border-top:1px solid rgba(255,255,255,.08) !important; }
        .boite-digitale-bas {
            position: absolute !important;
            right: 1.65vw !important;
            top: 3.1vh !important;
            width: 11.8vw !important;
            height: 6.2vh !important;
            background: linear-gradient(180deg,#111820 0%,#05080d 72%,#030507 100%) !important;
            border: 1.5px solid rgba(43,177,245,.92) !important;
            border-radius: 9px !important;
            box-shadow: 0 7px 18px rgba(0,0,0,.72), inset 0 0 11px rgba(0,0,0,.9), 0 0 7px rgba(22,164,230,.22) !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
        }
        .heure-digitale-js { 
            font-size: 2.38vw !important; height: 6.2vh !important; line-height: 6.2vh !important; padding-bottom: 0vh !important; 
            display: flex !important; align-items: center !important; justify-content: center !important; 
            font-family: 'Arial Narrow','Arial Black',Arial,sans-serif !important; font-weight: 900 !important; 
            text-shadow: 0 2px 2px #000, 0 0 1px rgba(255,255,255,.4) !important; 
        }
        .heure-digitale-labels { display: none !important; }
        .montre-retro-cercle {
            background:radial-gradient(circle at 50% 45%,#080a0d 0%,#000 72%,#000 100%) !important;
            border:1.8px solid #1f2a36 !important;
            box-shadow:0 6px 16px rgba(0,0,0,.78), inset 0 0 0 1px rgba(255,255,255,.08), 0 0 6px rgba(20,150,220,.12) !important;
        }
        .graduation { background:#aeb6bd !important; opacity:.68; }
        .graduation.principale { background:#fff !important; opacity:1; }
        .chiffre-cadran-fixe { font-family:'Arial Black',Arial,sans-serif !important; font-size:.91vw !important; text-shadow:0 1px 1px #000; }
        .heure { width:4px !important; height:3.0vw !important; background:#f4f7fa !important; }
        .minute { width:3px !important; height:4.75vw !important; background:#f4f7fa !important; }
        .seconde { width:1.5px !important; height:5.15vw !important; background:#b8ff00 !important; box-shadow:0 0 4px rgba(184,255,0,.55); }
        .pivot { width:10px !important; height:10px !important; background:#b8ff00 !important; box-shadow:0 0 7px rgba(184,255,0,.75) !important; }
        /* ================= CADRANS GRAPHIQUES DE RÉFÉRENCE ================= */
        :root{--cyan:#25b8f4;--panel:#071018;--panel2:#0d1821;--line:rgba(48,190,255,.78);--muted:#cbd4da;}
        
        #cadran-meteo-g{
            left:1.25vw !important;top:23.2vh !important;width:28.5vw !important;height:34.8vh !important;padding:1.1vw !important;

            border:1.5px solid rgba(35,180,240,.78) !important;border-radius:12px !important;

        #cadran-meteo-g .meteo-value{font-size:.92vw !important;}
        #cadran-saison-d{
            right:1.65vw !important;top:20.0vh !important;width:18.4vw !important;height:40.2vh !important;
            background:linear-gradient(180deg,#07111a,#050b11) !important;

        #cadran-saison-d>div:first-child>div:first-child div:last-child{font-size:1.65vw !important;margin-top:.35vh !important;}
        .case-illustration-pommier{position:absolute !important;left:2.2vw !important;right:2.2vw !important;bottom:.4vh !important;width:auto !important;height:28vh !important;background:transparent !important;border:0 !important;box-shadow:none !important;border-radius:0 !important;align-items:flex-end !important;}
        #season-tree-icon{width:100% !important;height:100% !important;}

        #cadran-lune-d{
            right:1.65vw !important;top:62.2vh !important;width:18.4vw !important;height:25.8vh !important;padding:1.0vw 1.15vw !important;
            background:linear-gradient(180deg,#07111a,#050b11) !important;
            border:1.5px solid rgba(35,180,240,.78) !important;border-radius:12px !important;

        #cadran-lune-d>div:first-child>div:nth-child(2){font-size:.72vw !important;line-height:1.45 !important;margin-top:.7vh !important;}
        #cadran-lune-d>div:first-child>div:nth-child(2) strong{font-size:.85vw !important;color:#ffb000 !important;}
        .lune-doree-image{width:6.8vw !important;height:6.8vw !important;flex:0 0 6.8vw !important;background-color:transparent !important;border:0 !important;box-shadow:0 0 18px rgba(255,255,255,.32) !important;}
        /* Prévisions : large bande basse comme dans la maquette */
        #zone-7-jours{left:1.25vw !important;bottom:4.1vh !important;width:63.5vw !important;height:31.5vh !important;padding:.9vh .55vw .85vh !important;display:flex !important;gap:.35vw !important;justify-content:space-between !important;background:linear-gradient(180deg,rgba(5,14,21,.94),rgba(3,9,14,.96)) !important;border:1.5px solid rgba(35,180,240,.78) !important;border-radius:12px !important;box-shadow:0 8px 18px rgba(0,0,0,.72),inset 0 0 13px rgba(0,0,0,.82),0 0 7px rgba(20,160,230,.12) !important;}
        #zone-7-jours::before{content:'PRÉVISIONS SUR 7 JOURS';position:absolute;left:0;right:0;top:.55vh;text-align:center;color:#fff;font-size:1.0vw;font-weight:900;letter-spacing:.2px;pointer-events:none;}
        .carte-prev-unique{width:calc((100% - 2.1vw)/7) !important;height:27.0vh !important;margin-top:2.35vh !important;padding:.95vh .25vw !important;background:linear-gradient(180deg,#0b151e,#071019) !important;border:1px solid rgba(133,171,194,.38) !important;border-radius:6px !important;justify-content:space-between !important;}
        .prev-jour{font-size:.92vw !important;}
        .prev-date{font-size:.60vw !important;color:#d2d8dc !important;}
        .prev-icon{height:6.2vh !important;display:flex;align-items:center;justify-content:center;flex:0 0 6.2vh !important;}
        .prev-icon svg{width:3.15vw !important;height:3.15vw !important;max-height:6.2vh !important;}
        .prev-max{font-size:1.42vw !important;}
        .prev-min{font-size:1.02vw !important;color:#35b9ff !important;}

        #school-view-bg{z-index:0 !important;}
        #sky-gradient{z-index:1 !important;}
        #season-layer{z-index:2 !important;}
        #night-dimmer{z-index:20 !important;}
        .lune-dans-le-ciel{z-index:35 !important;}
        #cloud-layer{z-index:15 !important;}
        #back-precipitations{z-index:25 !important;}
        #front-particles{z-index:30 !important;}
        #lightning-flash{z-index:40 !important;}

        #zone-7-jours .prev-jour{font-size:.90vw !important;}
        #zone-7-jours .prev-date{font-size:.58vw !important;}
        #zone-7-jours .prev-icon svg{width:3.1vw !important;height:3.1vw !important;}
        #zone-7-jours .prev-max{font-size:1.15vw !important;}
        #zone-7-jours .prev-min{font-size:1.02vw !important;color:#25b8f4 !important;}
        #zone-7-jours .prev-wind{font-size:.48vw !important;color:#e5edf2 !important;white-space:nowrap;}
    </style>
</head>

        let currentSunrise=null, currentSunset=null, currentCloudCover=0;
        function parseLocalWeatherTime(value){

        }
        function minutesOf(d){return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
        function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}
        function getDayPhase(now){

        function skyForPhase(phase,code){

        function gererCycleJourNuit(h,m){

        function calculPhaseLune(){
